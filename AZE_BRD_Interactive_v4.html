<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZE Platform — Feature Documentation</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;font-size:13px;background:#080b18;color:rgba(255,255,255,0.90);height:100vh;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:2px}::-webkit-scrollbar-track{background:transparent}
.header{height:52px;padding:0 20px;flex-shrink:0;background:#0a0e1e;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:16px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,#7622F2,#B700EA,transparent)}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#7622F2,#B700EA);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;box-shadow:0 3px 12px rgba(118,34,242,0.40)}
.brand-name{font-size:12px;font-weight:700;color:rgba(255,255,255,0.92)}
.brand-sub{font-size:10px;color:rgba(255,255,255,0.30);margin-left:2px}
.brand-sep{width:1px;height:20px;background:rgba(255,255,255,0.10);flex-shrink:0}
.role-switcher{display:flex;gap:3px;flex:1;overflow-x:auto;padding:2px 0}.role-switcher::-webkit-scrollbar{height:0}
.role-btn{padding:5px 12px;border-radius:20px;border:1px solid transparent;background:transparent;cursor:pointer;font-family:'Poppins',sans-serif;font-size:11px;color:rgba(255,255,255,0.45);white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:5px}
.role-btn:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.75)}
.role-btn.active{background:rgba(118,34,242,0.20);border-color:rgba(118,34,242,0.50);color:#c4a0ff;font-weight:600}
.role-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.search-wrap{position:relative}.search-wrap input{width:200px;padding:6px 10px 6px 30px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);border-radius:8px;font-size:11.5px;color:rgba(255,255,255,0.88);font-family:'Poppins',sans-serif;outline:none;transition:all .15s}
.search-wrap input:focus{border-color:rgba(118,34,242,0.50);background:rgba(118,34,242,0.07)}
.search-wrap input::placeholder{color:rgba(255,255,255,0.25)}
.search-ic{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:rgba(255,255,255,0.28);pointer-events:none}
.icon-btn{width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(255,255,255,0.55);transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,0.09)}
.shell{display:flex;flex:1;overflow:hidden}
/* LEFT NAV */
.lnav{width:242px;flex-shrink:0;background:#0d1424;border-right:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;overflow:hidden}
.lnav-scroll{flex:1;overflow-y:auto;padding:8px 0 20px}
.nav-group-label{padding:14px 16px 5px;font-size:9px;font-weight:700;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:.10em}
.nav-feature{display:flex;align-items:flex-start;gap:8px;padding:7px 14px 7px 20px;cursor:pointer;font-size:11.5px;color:rgba(255,255,255,0.48);position:relative;transition:background .10s,color .10s;border:none;background:none;width:100%;text-align:left;font-family:'Poppins',sans-serif;line-height:1.35}
.nav-feature:hover{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.80)}
.nav-feature.active{background:rgba(118,34,242,0.13);color:rgba(255,255,255,0.92);font-weight:600}
.nav-feature.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#7622F2,#B700EA)}
.nav-feature.hidden{display:none}
.nav-feature .nf-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.18);flex-shrink:0;margin-top:5px}
.nav-feature.active .nf-dot{background:#c4a0ff}
/* MAIN */
.main{flex:1;overflow-y:auto;background:#080b18}
.content-wrap{max-width:900px;margin:0 auto;padding:28px 32px 60px}
/* WELCOME */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:40px}
.welcome .w-icon{font-size:48px;margin-bottom:16px;opacity:.6}
.welcome h2{font-size:20px;font-weight:700;color:rgba(255,255,255,0.80);margin-bottom:8px}
.welcome p{font-size:13px;color:rgba(255,255,255,0.38);line-height:1.7;max-width:460px}
.welcome-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px;max-width:580px}
.welcome-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:14px;text-align:left}
.welcome-card .wc-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,0.28);margin-bottom:6px}
.welcome-card .wc-val{font-size:18px;font-weight:700;color:rgba(255,255,255,0.80)}
/* FEATURE DOC */
.feat-header{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.07)}
.feat-breadcrumb{font-size:10px;color:rgba(255,255,255,0.28);margin-bottom:10px;display:flex;align-items:center;gap:5px}
.feat-breadcrumb span{color:rgba(255,255,255,0.40)}
.feat-title{font-size:22px;font-weight:700;color:rgba(255,255,255,0.95);margin-bottom:10px;line-height:1.3}
.feat-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:9.5px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.tag-module{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.45);border:1px solid rgba(255,255,255,0.10)}
.tag-must{background:rgba(239,68,68,0.15);color:#f87171}
.tag-should{background:rgba(245,158,11,0.15);color:#fbbf24}
.tag-portal{background:rgba(59,130,246,0.13);color:#60a5fa;border:1px solid rgba(59,130,246,0.20)}
.tag-role{background:rgba(118,34,242,0.15);color:#c4a0ff;border:1px solid rgba(118,34,242,0.25)}
/* SECTIONS */
.doc-section{margin-bottom:28px}
.doc-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.28);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.doc-section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06)}
.overview-text{font-size:13px;color:rgba(255,255,255,0.58);line-height:1.85}
.overview-text p+p{margin-top:10px}
.actors-row{display:flex;gap:8px;flex-wrap:wrap}
.actor-chip{padding:5px 14px;border-radius:8px;font-size:11.5px;font-weight:500;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.60)}
/* FIELDS TABLE */
.fields-table{width:100%;border-collapse:collapse;font-size:12px}
.fields-table th{text-align:left;padding:9px 12px;background:rgba(118,34,242,0.12);font-weight:600;font-size:10px;color:#c4a0ff;border:1px solid rgba(118,34,242,0.20);text-transform:uppercase;letter-spacing:.04em}
.fields-table td{padding:9px 12px;border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.58);vertical-align:top;line-height:1.55}
.fields-table tr:nth-child(even) td{background:rgba(255,255,255,0.025)}
.fields-table tr:hover td{background:rgba(118,34,242,0.06)}
.fld-name{font-weight:600;color:rgba(255,255,255,0.85);font-family:monospace;font-size:11px}
.fld-req{display:inline-block;padding:1px 7px;border-radius:10px;font-size:9px;font-weight:700}
.fld-r{background:rgba(239,68,68,0.15);color:#f87171}
.fld-o{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.38)}
.fld-sys{background:rgba(59,130,246,0.13);color:#60a5fa}
/* FLOW */
.flow-steps{display:flex;flex-direction:column}
.flow-step{display:flex;position:relative}
.flow-step:not(:last-child)::after{content:'';position:absolute;left:15px;top:36px;bottom:0;width:1px;background:rgba(118,34,242,0.25)}
.flow-num-wrap{flex-shrink:0;padding-top:6px;margin-right:14px}
.flow-num{width:30px;height:30px;border-radius:50%;background:rgba(118,34,242,0.20);border:1px solid rgba(118,34,242,0.45);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#c4a0ff;position:relative;z-index:1}
.flow-body{flex:1;padding:5px 0 20px}
.flow-body-title{font-size:12.5px;font-weight:600;color:rgba(255,255,255,0.88);margin-bottom:4px}
.flow-body-desc{font-size:12px;color:rgba(255,255,255,0.52);line-height:1.65}
/* RULES */
.rule-list{display:flex;flex-direction:column}
.rule-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.rule-item:last-child{border:none}
.rule-dot{width:5px;height:5px;border-radius:50%;background:rgba(118,34,242,0.70);flex-shrink:0;margin-top:7px}
.rule-text{font-size:12.5px;color:rgba(255,255,255,0.56);line-height:1.65}
.rule-text strong{color:rgba(255,255,255,0.80);font-weight:600}
/* AC TABLE */
.ac-table{width:100%;border-collapse:collapse;font-size:12px}
.ac-table th{text-align:left;padding:8px 10px;background:rgba(255,255,255,0.04);font-weight:600;font-size:9.5px;color:rgba(255,255,255,0.30);border:1px solid rgba(255,255,255,0.07);text-transform:uppercase;letter-spacing:.04em}
.ac-table td{padding:8px 10px;border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.56);vertical-align:top;line-height:1.55}
.ac-table tr:nth-child(even) td{background:rgba(255,255,255,0.025)}
/* NOTE */
.note-box{background:rgba(245,158,11,0.08);border-left:3px solid #f59e0b;border-radius:0 6px 6px 0;padding:11px 14px;margin-top:4px}
.note-box p{font-size:12px;color:#fbbf24;line-height:1.65}
/* RELATED */
.related-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.related-chip{font-size:11px;padding:4px 12px;background:rgba(59,130,246,0.10);color:#60a5fa;border:1px solid rgba(59,130,246,0.22);border-radius:20px;cursor:pointer;font-family:'Poppins',sans-serif;transition:opacity .15s}
.related-chip:hover{opacity:.75}
/* INFO BOX */
.info-box{background:rgba(118,34,242,0.07);border:1px solid rgba(118,34,242,0.20);border-radius:10px;padding:12px 16px;margin-bottom:20px}
.info-box p{font-size:12px;color:#c4a0ff;line-height:1.65}
/* LIGHT MODE */
body.light{background:#f1f5f9;color:#0f172a}
body.light .header{background:#fff;border-bottom-color:rgba(0,0,0,0.08)}
body.light .lnav{background:#fff;border-right-color:rgba(0,0,0,0.08)}
body.light .nav-group-label{color:#94a3b8}
body.light .nav-feature{color:#64748b}
body.light .nav-feature:hover{background:rgba(0,0,0,0.03);color:#0f172a}
body.light .nav-feature.active{background:rgba(118,34,242,0.08);color:#0f172a}
body.light .nav-feature .nf-dot{background:#cbd5e1}
body.light .nav-feature.active .nf-dot{background:#7622F2}
body.light .main{background:#f1f5f9}
body.light .brand-name{color:#0f172a}
body.light .brand-sub{color:#94a3b8}
body.light .role-btn{color:#64748b}
body.light .role-btn:hover{background:rgba(0,0,0,0.04);color:#0f172a}
body.light .role-btn.active{background:rgba(118,34,242,0.10);border-color:rgba(118,34,242,0.35);color:#7622F2}
body.light .search-wrap input{background:#f1f5f9;border-color:rgba(0,0,0,0.12);color:#0f172a}
body.light .search-wrap input::placeholder{color:#94a3b8}
body.light .icon-btn{background:#f1f5f9;border-color:rgba(0,0,0,0.10);color:#64748b}
body.light .welcome h2{color:#0f172a}
body.light .welcome p{color:#64748b}
body.light .welcome-card{background:#fff;border-color:rgba(0,0,0,0.08)}
body.light .welcome-card .wc-label{color:#94a3b8}
body.light .welcome-card .wc-val{color:#0f172a}
body.light .feat-breadcrumb{color:#94a3b8}
body.light .feat-breadcrumb span{color:#64748b}
body.light .feat-title{color:#0f172a}
body.light .tag-module{background:rgba(0,0,0,0.05);color:#94a3b8;border-color:rgba(0,0,0,0.08)}
body.light .doc-section-title{color:#94a3b8}
body.light .doc-section-title::after{background:rgba(0,0,0,0.07)}
body.light .overview-text{color:#475569}
body.light .actor-chip{background:#f8fafc;border-color:rgba(0,0,0,0.08);color:#475569}
body.light .fields-table th{background:rgba(118,34,242,0.08);color:#7622F2;border-color:rgba(118,34,242,0.15)}
body.light .fields-table td{border-color:rgba(0,0,0,0.07);color:#475569}
body.light .fields-table tr:nth-child(even) td{background:rgba(0,0,0,0.02)}
body.light .fields-table tr:hover td{background:rgba(118,34,242,0.04)}
body.light .fld-name{color:#0f172a}
body.light .fld-o{background:rgba(0,0,0,0.06);color:#64748b}
body.light .flow-body-title{color:#0f172a}
body.light .flow-body-desc{color:#64748b}
body.light .flow-step:not(:last-child)::after{background:rgba(118,34,242,0.15)}
body.light .rule-text{color:#475569}
body.light .rule-text strong{color:#0f172a}
body.light .rule-item{border-bottom-color:rgba(0,0,0,0.05)}
body.light .rule-dot{background:#7622F2}
body.light .ac-table th{background:rgba(0,0,0,0.03);color:#94a3b8;border-color:rgba(0,0,0,0.07)}
body.light .ac-table td{border-color:rgba(0,0,0,0.07);color:#475569}
body.light .ac-table tr:nth-child(even) td{background:rgba(0,0,0,0.02)}
body.light .info-box{background:rgba(118,34,242,0.05);border-color:rgba(118,34,242,0.15)}
body.light .info-box p{color:#7622F2}
</style>
</head>
<body>
<div class="header">
  <div class="brand">
    <div class="brand-logo">AZ</div>
    <div>
      <div class="brand-name">AZE Platform <span class="brand-sub">Feature Docs</span></div>
    </div>
  </div>
  <div class="brand-sep"></div>
  <div class="role-switcher" id="role-switcher"></div>
  <div class="hdr-actions">
    <div class="search-wrap">
      <span class="search-ic">🔍</span>
      <input type="text" id="srch" placeholder="Search features, fields, modules…" oninput="doSearch(this.value)">
    </div>
    <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">🌗</button>
  </div>
</div>
<div class="shell">
  <nav class="lnav"><div class="lnav-scroll" id="lnav-scroll"></div></nav>
  <div class="main" id="main"><div class="content-wrap" id="content-wrap"></div></div>
</div>

<script>
const ROLES=[
  {id:'all',label:'All',dot:'linear-gradient(135deg,#7622F2,#B700EA)'},
  {id:'super-admin',label:'Super Admin',dot:'#9b77f5'},
  {id:'platform-admin',label:'Platform Admin',dot:'#60a5fa'},
  {id:'org-admin',label:'Org Admin',dot:'#34d399'},
  {id:'admin',label:'Admin',dot:'#85B7EB'},
  {id:'manager',label:'Manager',dot:'#fbbf24'},
  {id:'teacher',label:'Teacher',dot:'#f97316'},
  {id:'compliance',label:'Compliance Mgr',dot:'#f472b6'},
  {id:'student',label:'Student',dot:'#fb923c'},
  {id:'reviewer',label:'Reviewer',dot:'#B700EA'},
  {id:'academic',label:'Academic',dot:'#818cf8'},
];
const GROUPS=[
  {id:'IDENTITY & ACCESS',label:'Identity & Access'},
  {id:'ORGANISATION',label:'Organisation'},
  {id:'ASSESSMENT',label:'Assessment'},
  {id:'RESULTS',label:'Results'},
  {id:'COMMERCE',label:'Commerce'},
  {id:'EVALUATION',label:'Evaluation'},
  {id:'COMPLIANCE',label:'Compliance'},
  {id:'COMMUNICATIONS',label:'Communications'},
  {id:'STUDENT PORTAL',label:'Student Portal'},
  {id:'MY TESTS',label:'My Tests'},
  {id:'TEST TAKING',label:'Test Taking — Assessment Engine'},
  {id:'TEST SECURITY',label:'Test Security'},
  {id:'MY REPORTS',label:'My Reports'},
  {id:'STUDENT SETTINGS',label:'Student Settings'},
  {id:'STUDENT PACKAGES',label:'Packages & Payments'},
  {id:'STUDENT OTHER',label:'Other Student Features'},
];

const FEATURES=[
// ── IDENTITY & ACCESS ──────────────────────────────────────────────────────────
{id:'reg-self-signup',module:'Registration & Onboarding',group:'IDENTITY & ACCESS',title:'Student Self-Registration',priority:'Must Have',
roles:['all','student','super-admin'],portals:['Student Portal'],actors:['Student','System','Brevo'],
overview:`<p>Students independently create an AZE account from the Student Portal signup page on the <strong>esai subdomain only</strong>. The form collects personal and demographic information, enforces a strong password policy, and requires explicit policy acceptance before account creation.</p>
<p>Upon submission the system validates the email for global uniqueness and sends a Brevo verification email. The account stays in <strong>pending_verification</strong> status until the link is clicked. Students aged below 16 are placed into consent-pending state and the Parental Consent flow is triggered before any portal access is granted.</p>
<p>All self-registered students are automatically assigned to the default organisation <strong>ESAI Inc</strong>. The first login after email verification triggers the in-app onboarding tour powered by @reactour/tour.</p>`,
fields:[
  {name:'first_name',type:'Text',req:'Required',valid:'2–50 chars, letters and spaces only',desc:"Student's first/given name"},
  {name:'last_name',type:'Text',req:'Required',valid:'2–50 chars, letters and spaces only',desc:"Student's family/surname"},
  {name:'email',type:'Email',req:'Required',valid:'Valid email format, globally unique across the entire platform',desc:'Used as login identifier and for all transactional emails'},
  {name:'password',type:'Password',req:'Required',valid:'8–16 chars; min 1 uppercase, 1 lowercase, 1 digit, 1 special char (@$!%*?&#^); no spaces',desc:'Account password — stored as bcrypt hash, never in plain text'},
  {name:'confirm_password',type:'Password',req:'Required',valid:'Must match the password field exactly',desc:'Password confirmation to prevent typos'},
  {name:'date_of_birth',type:'Date',req:'Required',valid:'Valid past date. System calculates age; age < 16 triggers minor/parental consent flow.',desc:'Determines minor status — used to gate parental consent requirement'},
  {name:'country',type:'Dropdown',req:'Required',valid:'Select from predefined ISO country list',desc:"Student's country of residence"},
  {name:'nationality',type:'Dropdown',req:'Required',valid:'Select from predefined nationality list',desc:"Student's nationality"},
  {name:'gender',type:'Dropdown',req:'Required',valid:'Male / Female / Prefer not to say',desc:"Student's gender identity"},
  {name:'policy_accepted',type:'Checkbox',req:'Required',valid:'Must be checked. Unchecked prevents form submission.',desc:'Explicit acceptance of platform Terms of Service and Privacy Policy'},
],
flow:[
  {title:'Visit signup page',desc:'Student navigates to the esai subdomain (e.g., esai.azetest.ai) and clicks Sign Up. The public signup form is rendered.'},
  {title:'Fill and submit form',desc:'Student fills all required fields. Frontend validates using Yup schema before sending POST /api/v1/auth/organization/signup.'},
  {title:'Backend validates email uniqueness',desc:'System checks if the email already exists globally. If duplicate: HTTP 400 with field-level error. If new: proceed to account creation.'},
  {title:'Age-based minor check',desc:'System calculates age from date_of_birth. If age < 16: account created with is_minor: true and status: suspended — parental consent required before any access. If age ≥ 16: status set to pending_verification.'},
  {title:'Verification email sent',desc:'Brevo sends a transactional email with a time-limited verification link pointing to /activate-account?token=... on the Student Portal.'},
  {title:'Student clicks verification link',desc:'Backend validates token. If valid and not expired: account status changes to active. Student is redirected to the dashboard.'},
  {title:'Onboarding tour triggered',desc:'On first login, /auth/me returns has_completed_tour: false. The dashboard auto-launches the guided tour via @reactour/tour. Steps fetched from GET /api/v1/auth/tour-steps.'},
],
rules:[
  {text:'<strong>Subdomain restriction:</strong> Public self-signup is only available on the esai subdomain. Attempting signup on any other org subdomain returns HTTP 400.'},
  {text:'<strong>Email uniqueness:</strong> Email must be globally unique across all organisations and all portals on the platform.'},
  {text:'<strong>Password complexity:</strong> 8–16 characters; must contain at least one uppercase, one lowercase, one digit, and one special character from @$!%*?&#^. Spaces are not permitted.'},
  {text:'<strong>Minor gate (total block):</strong> Students aged < 16 cannot access ANY portal feature until parental consent OTP is verified.'},
  {text:'<strong>Default org assignment:</strong> All self-registered students are assigned to ESAI Inc. Students cannot choose their organisation at signup.'},
  {text:'<strong>Staff cannot self-register:</strong> Managers, teachers, and platform admins must be invited via email. Signup form is student-only.'},
  {text:'<strong>Social signup gap:</strong> Google OAuth signup does not currently enforce the minor age check — known compliance gap under active review.'},
],
acs:[
  ['1','Valid registration creates account and sends verification email within 60 seconds.','Must Have'],
  ['2','Duplicate email rejected with field-level inline error before form submission.','Must Have'],
  ['3','Password not meeting complexity shows specific error per unfulfilled condition.','Must Have'],
  ['4','Student aged < 16 blocked from all portal access; parental consent flow triggered.','Must Have'],
  ['5','Verification link click sets account to active and redirects to dashboard.','Must Have'],

{id:'reg-google-oauth',module:'Registration & Onboarding',group:'IDENTITY & ACCESS',title:'Google OAuth Signup & Login',priority:'Must Have',

overview:`<p>Students can sign up and log in using their existing Google account via OAuth 2.0. Clicking "Continue with Google" initiates a redirect to Google's authentication servers. No platform password is required or stored.</p>
<p>On the OAuth callback, the backend matches the returned Google ID or email against existing platform accounts. If a match is found, the student is logged in. If no match is found, a new account is automatically created under <strong>ESAI Inc</strong>. Google OAuth accounts skip the email verification step — accounts are immediately active.</p>
<p>Google OAuth users have no platform-managed password and therefore <strong>cannot use the Forgot Password flow</strong>. They must always authenticate through Google.</p>`,

  {name:'email',type:'System',req:'System',valid:'Returned by Google profile data',desc:'Email from Google profile — used as primary platform identifier'},
  {name:'full_name',type:'System',req:'System',valid:'Returned by Google profile data',desc:'Display name from Google profile — stored as account name'},
  {name:'profile_picture',type:'System',req:'Optional',valid:'Returned by Google if available',desc:'Google profile photo URL stored as the student avatar'},
],
flow:[
  {title:'Click "Continue with Google"',desc:"Student clicks the Google OAuth button on the login or signup page. Frontend calls GET /api/v1/auth/google/login which redirects to Google's consent screen."},
  {title:'Google authentication',desc:"Student authenticates with Google (if not already signed in) and grants permissions. Google redirects back to the platform callback URL with an authorization code."},
  {title:'Backend callback processing',desc:'Backend exchanges the authorization code for Google profile data. Logic: (1) Google ID match → sign in existing user. (2) Email match, no Google ID → link Google to existing account. (3) No match → auto-create new account under ESAI Inc.'},
  {title:'JWT tokens issued',desc:'Access token and refresh token issued. Returned as query params on redirect to the Student Portal frontend. Session record created in user_sessions.'},
  {title:'Dashboard loads',desc:'Student lands on dashboard. New accounts trigger the onboarding tour. Returning accounts load normally.'},
],
rules:[
  {text:'<strong>No minor check (known gap):</strong> Google OAuth does not enforce the age/minor check. Not available for under-16 students until this gap is resolved.'},
  {text:'<strong>No password reset:</strong> Google OAuth users cannot use the "Forgot Password" flow. Must authenticate via Google always.'},
  {text:'<strong>Account linking:</strong> If a Google email matches an existing email/password account, Google is linked to that account automatically.'},
  {text:'<strong>Default org:</strong> New Google OAuth registrations are always assigned to ESAI Inc.'},
  {text:'<strong>Immediate activation:</strong> Google OAuth accounts skip email verification — account is immediately active after first OAuth login.'},

acs:[

related:['reg-self-signup','reg-minor-consent']},

{id:'reg-minor-consent',module:'Registration & Onboarding',group:'IDENTITY & ACCESS',title:'Minor Student — Parental Consent Flow',priority:'Must Have',
roles:['all','student'],portals:['Student Portal'],actors:["Student (age < 16)",'Parent / Guardian','System','Brevo'],
overview:`<p>When a student's age is below 16, the platform enforces a mandatory parental consent gate before any portal feature is accessible. The entire portal is blocked behind the <strong>ParentDetailsModal</strong> — no page, test, setting, notification, or purchase can be accessed until a parent or guardian verifies via a time-limited OTP.</p>
<p>The student provides their parent's name and email address. The system encrypts the parent email using <strong>Fernet symmetric encryption</strong> and stores a SHA-256 deterministic hash for lookup. A 6-digit OTP with a <strong>15-minute validity window</strong> is sent exclusively to the parent's email — not the student's. Once verified, the account is flagged as <strong>parent_verified: true</strong> and full access is granted.</p>
<p>The minor threshold is globally set at age 16. Per-organisation configurable thresholds (e.g., COPPA at 13, GDPR-K at 16) are planned but not yet implemented.</p>`,
fields:[
  {name:'parent_name',type:'Text',req:'Required',valid:'2–100 chars, free text',desc:"Full name of parent or legal guardian — for record-keeping purposes"},
  {name:'parent_email',type:'Email',req:'Required',valid:'Valid email format',desc:"Parent or guardian's email address — OTP will be sent HERE, not to the student's email"},
  {name:'otp_code',type:'Number',req:'Required',valid:'Exactly 6 digits, valid for 15 minutes from generation time',desc:"One-time password entered by the student after the parent receives it on their email"},
],
flow:[
  {title:'Login detects minor flag',desc:'/auth/me returns is_minor: true, parent_verified: false. The authRequired guard intercepts all route navigation.'},
  {title:'ParentDetailsModal displayed',desc:'All portal routes are blocked. The ParentDetailsModal is the only UI visible. No dashboard, tests, packages, settings, or notifications are accessible.'},
  {title:'Student submits parent details',desc:"Student enters parent's full name and email address and submits. System encrypts email (Fernet), creates a SHA-256 lookup hash, saves the parental consent record."},
  {title:'OTP sent to parent email',desc:"Brevo sends a 6-digit OTP to the parent's email address. Valid for exactly 15 minutes from generation."},
  {title:'Student enters OTP',desc:'Student obtains the OTP from their parent and enters it in the verification field in the modal.'},
  {title:'OTP verification',desc:'Backend validates the OTP against the stored record and checks the 15-minute expiry window. On success: parent_verified set to true on the user record.'},
  {title:'Full portal access granted',desc:'The consent gate is removed. Student is redirected to the dashboard and can access all features for their role.'},
],
rules:[
  {text:'<strong>Total block:</strong> A minor with parent_verified: false cannot access ANY portal feature. Dashboard, tests, packages, settings, and notifications are all blocked.'},
  {text:"<strong>OTP goes to parent:</strong> The OTP is sent to the parent's email address, not the student's. This is a deliberate design decision for consent integrity."},
  {text:'<strong>OTP expiry:</strong> OTP expires after 15 minutes. After expiry, the student must request a new OTP — a fresh 15-minute window is reset.'},
  {text:'<strong>No automatic lockout:</strong> There is no automatic account lockout for pending consent. The account stays consent-pending indefinitely until the parent completes verification.'},
  {text:'<strong>Parent details immutable post-verification:</strong> Once verified, parent name and email cannot be changed by the student. Admin must intervene.'},
  {text:'<strong>Global threshold:</strong> Minor age is currently 16 globally. Per-org configurable threshold is planned but not yet implemented.'},
],
acs:[
  ['1','Student aged < 16 cannot access any portal page — only ParentDetailsModal is shown.','Must Have'],
  ["2","OTP sent to parent email (not student's) within 60 seconds of form submission.",'Must Have'],
  ['3','Valid OTP within 15 minutes sets parent_verified: true and grants full portal access.','Must Have'],
  ['4','Expired OTP rejected; student offered a Resend OTP option.','Must Have'],
  ['5','Incorrect OTP shows a clear error and allows the student to retry.','Must Have'],
  ['6','Once parent_verified: true, the consent modal never appears on subsequent logins.','Must Have'],
],
note:null,
related:['reg-self-signup','auth-student-login']},

{id:'reg-onboarding-tour',module:'Registration & Onboarding',group:'IDENTITY & ACCESS',title:'Student Onboarding Tour',priority:'Should Have',
roles:['all','student'],portals:['Student Portal'],actors:['Student','System'],
overview:`<p>First-time students are guided through the Student Portal via an interactive in-app walkthrough powered by <strong>@reactour/tour</strong>. The tour launches automatically on the student's first login after email verification (or after parental consent for minor students) and highlights the key areas: dashboard, assigned tests, packages, results, and settings.</p>
<p>Tour steps are fetched dynamically from the backend at <code>GET /api/v1/auth/tour-steps</code>, allowing content to be updated without a frontend deployment. Once the student completes or skips the tour, the flag <strong>has_completed_tour: true</strong> is persisted via <code>PATCH /api/v1/auth/students/onboarding-tour</code> and the tour never repeats.</p>`,

// ── AUTHENTICATION ─────────────────────────────────────────────────────────────
{id:'auth-student-login',module:'Authentication',group:'IDENTITY & ACCESS',title:'Student Portal Login',priority:'Must Have',
roles:['all','student'],portals:['Student Portal'],actors:['Student','System','CRM (for CRM-linked students)'],
overview:`<p>Students access the platform via the Student Portal login page, available on the <strong>esai subdomain</strong> or their organisation's assigned student subdomain. Login uses email and password credentials with JWT-based session management backed by the <code>user_sessions</code> database table.</p>
<p>After 3 consecutive failed password attempts, the account is locked for <strong>30 minutes</strong>. For CRM-linked students, an additional validation step occurs against the external CRM on every login — if the CRM profile differs from the local record, the local record is updated (CRM always wins). Each successful login creates a session record that can be remotely invalidated.</p>
<p>Every page load calls <code>/auth/me</code> to validate the session and return the user's role, permissions, and state flags (<code>is_minor</code>, <code>parent_verified</code>, <code>has_completed_tour</code>). Logout deletes the session record immediately — token invalid server-side even before JWT expiry.</p>`,
fields:[
  {name:'email',type:'Email',req:'Required',valid:'Registered student email address',desc:"Student's login identifier"},
  {name:'password',type:'Password',req:'Required',valid:'Must match stored bcrypt hash',desc:"Student's account password"},
],
flow:[
  {title:'Submit credentials',desc:'Student enters email and password. POST /api/v1/auth/students/login with email, password, subdomain, device info, and FCM token for push notifications.'},
  {title:'Lockout check',desc:'Backend checks users.login_blocked_until. If locked and not yet expired: HTTP 400 with remaining lockout duration. If expired: reset counter and proceed.'},
  {title:'Credential validation',desc:'Password validated using bcrypt (SHA-256 legacy fallback). On mismatch: increment users.login_failed_attempts. On 3rd failure: set login_blocked_until = now + 30 minutes.'},
  {title:'CRM validation (CRM users only)',desc:'If is_crm_user: true, backend validates against external CRM. If CRM profile differs from local record: local record upserted with CRM data (CRM wins).'},
  {title:'Minor check note',desc:'If is_minor: true and parent_verified: false — login succeeds but /auth/me will trigger the parental consent gate on every page load.'},
  {title:'Session creation',desc:'JWT access token + refresh token issued. user_sessions record created: organization_user_id, FCM token, device type, OS, browser, IP address, app version.'},
  {title:'Frontend token storage',desc:'accessToken and refreshToken stored in localStorage. userData (encrypted profile) stored via react-secure-storage under "userData" key. Student redirected to dashboard.'},
],
rules:[
  {text:'<strong>Login lockout:</strong> 3 failed password attempts → 30-minute account block. Tracked in users.login_failed_attempts and users.login_blocked_until.'},
  {text:'<strong>Counter reset:</strong> Failed attempt counter resets to 0 on a successful login.'},
  {text:'<strong>CRM always wins:</strong> CRM-linked students have their local record overwritten by CRM data on every login.'},
  {text:'<strong>Multiple sessions allowed:</strong> One user_sessions record per device/login. Multiple concurrent sessions are permitted.'},
  {text:'<strong>Server-side logout:</strong> Logout deletes the user_sessions record. Token immediately invalid — not just at JWT expiry.'},
  {text:"<strong>Token key separation:</strong> Student portal uses 'accessToken' and 'refreshToken' localStorage keys — distinct from admin portal keys (admin_accessToken, admin_refreshToken)."},
],
acs:[
  ['1','Valid credentials issue tokens and redirect to dashboard within 3 seconds.','Must Have'],
  ['2','Third consecutive wrong password locks account for 30 minutes with remaining time shown.','Must Have'],
  ['3','Logging out immediately invalidates the token on the server.','Must Have'],
  ['4','/auth/me returns is_minor, parent_verified, has_completed_tour alongside role and permissions.','Must Have'],
],
note:null,
related:['reg-self-signup','reg-minor-consent','auth-password-reset']},

{id:'auth-admin-login',module:'Authentication',group:'IDENTITY & ACCESS',title:'Admin Panel Login (with 2FA)',priority:'Must Have',
roles:['all','super-admin','platform-admin','admin'],portals:['Admin Panel'],actors:['Super Admin','Platform Admin','Admin','System'],
overview:`<p>Platform-level administrators (Super Admin, Platform Admin, Admin) access the platform exclusively via the Admin Panel. Unlike student login, this flow mandates <strong>TOTP multi-factor authentication</strong> (Google Authenticator). JWT tokens are only issued after the OTP is successfully verified — not at the password stage.</p>
<p>On first login, if TOTP is not yet configured, the backend returns <code>TWO_FA_SETUP_REQUIRED</code> with a QR code URL. The user scans with Google Authenticator and enters the first code to complete setup. A "Forgot QR Code?" option regenerates the QR by re-entering the password. Admin tokens are stored under separate localStorage keys from student tokens.</p>`,
fields:[
  {name:'email',type:'Email',req:'Required',valid:'Registered admin email address',desc:'Admin account email'},
  {name:'password',type:'Password',req:'Required',valid:'Must match stored hash',desc:'Admin account password'},
  {name:'otp_code',type:'Number',req:'Required',valid:'6-digit TOTP code — valid approximately 30 seconds per time window',desc:'Code from Google Authenticator or any compatible TOTP app'},
],
flow:[
  {title:'Submit email + password',desc:'Admin enters credentials. POST /api/v1/auth/platform/login.'},
  {title:'2FA status check',desc:'Backend validates password. If is_2fa_verified: false → generate TOTP secret + QR code → return TWO_FA_SETUP_REQUIRED with QR URL. If is_2fa_verified: true → return OTP challenge only (no QR shown).'},
  {title:'First-time QR setup',desc:'Admin Panel displays QR code. User scans with Google Authenticator. Enters first 6-digit OTP to complete 2FA setup.'},
  {title:'OTP verification',desc:'POST /api/v1/auth/validate-2fa. Backend verifies using pyotp.TOTP(user.secret_2fa).verify(otp). On success: is_2fa_verified: true saved. JWT tokens issued.'},
  {title:'Subsequent logins',desc:'Password check → OTP input only (no QR shown) → on valid OTP: tokens issued.'},
  {title:'Lost QR recovery',desc:'User clicks "Forgot QR Code?", re-enters password. Backend validates → regenerates QR → user re-scans with authenticator app.'},
],
rules:[
  {text:'<strong>2FA is mandatory and cannot be bypassed:</strong> Tokens are NOT issued at the password stage — only after successful OTP verification.'},
  {text:'<strong>TOTP secret encrypted:</strong> Stored in users.secret_2fa in encrypted format on the user record.'},
  {text:'<strong>2FA scope:</strong> Only Admin Panel platform-level roles. Org Admin, Manager, Teacher, Student, Reviewer, and Compliance Manager do NOT have 2FA.'},
  {text:'<strong>Global toggle:</strong> Super Admin can enable/disable 2FA enforcement globally via Admin Panel → System Configuration → 2FA Settings.'},
  {text:"<strong>Separate token keys:</strong> Admin tokens stored as 'admin_accessToken' and 'admin_refreshToken' in localStorage — distinct from student portal keys."},
],
acs:[
  ['1','First-time platform admin login shows QR setup screen before any token is issued.','Must Have'],
  ['2','Valid OTP during setup issues tokens and sets is_2fa_verified: true.','Must Have'],
  ['3','Invalid or expired OTP rejected with no tokens issued.','Must Have'],
  ['4','Returning admin sees only OTP input — no QR code shown.','Must Have'],
  ['5','"Forgot QR Code?" with correct password regenerates the QR for re-scanning.','Should Have'],
],
note:'2FA applies to the Admin Panel only. Client Portal, Student Portal, and Evaluation Portal do not have 2FA.',
related:['auth-student-login']},

{id:'auth-password-reset',module:'Authentication',group:'IDENTITY & ACCESS',title:'Password Reset — Forgot Password',priority:'Must Have',
roles:['all','student','super-admin','platform-admin','admin','org-admin','manager','teacher'],portals:['Student Portal','Admin Panel','Client Portal'],actors:['User','System','Brevo'],
overview:`<p>Any user who has forgotten their password can initiate a reset from the login page. The flow is rate-limited to <strong>3 requests per hour</strong> to prevent abuse. Submitting the email generates a JWT-signed reset token stored on the user record and sends a subdomain-aware Brevo email.</p>
<p>The reset link routes to <code>/reset-password?token=...&amp;email=...</code>. On submission of the new password, the token is validated, the password bcrypt-hashed and updated, and the token cleared. The link is <strong>single-use</strong>. Google OAuth users cannot use this flow — they have no platform-managed password.</p>`,
fields:[
  {name:'email',type:'Email',req:'Required',valid:'Must match an existing active account',desc:'The registered email address of the account to reset'},
  {name:'new_password',type:'Password',req:'Required',valid:'8–16 chars; min 1 uppercase, 1 lowercase, 1 digit, 1 special char; no spaces',desc:'The new password to set for the account'},
  {name:'confirm_password',type:'Password',req:'Required',valid:'Must exactly match the new_password field',desc:'Confirmation to prevent typos in the new password'},
],
flow:[
  {title:'Submit email for reset',desc:'User enters email on /forgot-password page. POST /api/v1/auth/password/reset called.'},
  {title:'Rate limit check',desc:'Backend checks users.password_blocked_until. If 3 reset requests have been made in the past hour: HTTP 429. Otherwise: proceed.'},
  {title:'Token generation and email dispatch',desc:'Backend generates a JWT reset token, saves it as users.forgot_password_token, and triggers Brevo email with the reset link pointing to the correct org subdomain.'},
  {title:'User submits new password',desc:'User clicks the email link, lands on /reset-password. Enters and confirms new password. POST /api/v1/auth/password/reset-confirm.'},
  {title:'Token validation and password update',desc:'Backend decodes JWT, validates signature and expiry, verifies it matches users.forgot_password_token. On success: bcrypt-hash new password, save, clear the reset token, reset attempt counter.'},
  {title:'Redirect to login',desc:'User redirected to login page with success message. Note: existing active sessions are NOT invalidated (known security gap).'},
],
rules:[
  {text:'<strong>Rate limit:</strong> 3 reset requests per hour. 4th attempt returns HTTP 429. Stored separately from the login lockout counter.'},
  {text:'<strong>Single-use token:</strong> Reset token is cleared on successful use. Attempting to reuse a consumed token returns an error.'},
  {text:'<strong>Google OAuth users blocked:</strong> Attempting password reset for a Google OAuth account returns an error — these accounts have no platform-managed password.'},
  {text:'<strong>Session gap:</strong> Password reset does NOT force-logout existing active sessions — this is a known security gap.'},
  {text:'<strong>Subdomain-aware links:</strong> Reset email links point to the correct org subdomain of the user requesting reset.'},
],
acs:[
  ['1','Valid email submits and reset email arrives within 60 seconds.','Must Have'],
  ['2','After 3 requests in one hour, further requests return HTTP 429.','Must Have'],
  ['3','Reset link is single-use — clicking it again after use shows an error.','Must Have'],
  ['4','New password meeting complexity rules is accepted and applied.','Must Have'],
  ['5','Google OAuth user attempting password reset receives a clear error.','Must Have'],
],
note:'Password reset does not invalidate existing active sessions — known security gap to be addressed in a future security release.',
related:['auth-student-login','auth-admin-login']},

{id:'group-create',module:'Campus & Group Management',group:'ORGANISATION',title:'Create & Manage Group / Class',priority:'Must Have',
roles:['all','org-admin','admin','manager'],portals:['Client Portal','Admin Panel'],actors:['Org Admin','Admin','Manager'],
overview:`<p>Groups (also called classes or batches) are sub-units of a campus that organise students into cohorts. Each group has an automated <strong>lifecycle</strong> driven by start and end dates: <code>upcoming → active → completed</code>. The transition happens nightly via the <code>group_lifecycle_job</code> cron — no manual intervention is needed.</p>
<p>Groups have a CEFR target level, a colour label for visual identification in calendars and listings, and optional instructor and schedule fields. A group belongs to exactly one campus and cannot be moved after creation.</p>`,
fields:[
  {name:'name',type:'Text',req:'Required',valid:'2–100 chars',desc:'Group/class name (e.g., "Batch A — B2 Level Oct 2026")'},
  {name:'campus_id',type:'Dropdown',req:'Required',valid:'Active campus within the organisation. Cannot be changed after creation.',desc:'The campus this group belongs to'},
  {name:'level',type:'Dropdown',req:'Optional',valid:'Pre-A1, A1, A2, A2+, B1, B1+, B2, B2+, C1, C2',desc:'Target CEFR level for this group — for informational purposes and filtering'},
  {name:'start_date',type:'Date',req:'Required',valid:'Today or a future date',desc:'Group start date — when lifecycle transitions from upcoming to active'},
  {name:'end_date',type:'Date',req:'Required',valid:'Must be strictly after start_date. Same-day not permitted.',desc:'Group end date — when lifecycle transitions from active to completed'},
  {name:'instructor_id',type:'Dropdown',req:'Optional',valid:'Active staff member in the organisation',desc:'Assigned instructor or teacher for this group'},
  {name:'schedule',type:'Text',req:'Optional',valid:'Free text, max 200 chars',desc:'Human-readable schedule description (e.g., "Mon/Wed/Fri 9–11am")'},
  {name:'color',type:'Color',req:'Required',valid:'Hex colour code (e.g., #4F46E5)',desc:'Visual label colour for calendar view and listing identification badges'},
],
flow:[
  {title:'Open create group form',desc:'Admin clicks "Add Group" within a campus view or from the Groups section. Form opens with campus pre-selected if in campus context.'},
  {title:'Fill group details',desc:'Admin enters name, start/end dates, optional CEFR level, colour, and instructor. End date validated as strictly after start date.'},
  {title:'Submit',desc:'POST /api/v1/groups. Group created with initial status: upcoming.'},
  {title:'Students assigned',desc:'Students are assigned to the campus and optionally a group from their profile or via bulk import.'},
  {title:'Lifecycle automation (cron)',desc:'group_lifecycle_job cron runs nightly. Groups whose start_date has arrived → status: active. Groups whose end_date has passed → status: completed. No manual action needed.'},
],
rules:[
  {text:'<strong>Lifecycle is fully automated:</strong> Groups transition upcoming → active → completed automatically based on dates. No manual intervention is needed or possible.'},
  {text:'<strong>Campus scope is permanent:</strong> A group belongs to exactly one campus. It cannot be moved to a different campus after creation.'},
  {text:'<strong>End date constraint:</strong> end_date must be strictly after start_date. Same-day groups are not permitted.'},
  {text:'<strong>Soft delete:</strong> Deleting a group soft-deletes it — students lose their group assignment but remain in the system.'},
],
acs:[
  ['1','Valid group creation saves and appears in the listing immediately with status: upcoming.','Must Have'],
  ['2','end_date on or before start_date rejected with a field-level error.','Must Have'],
  ['3','Group transitions to active on start_date and to completed on end_date automatically via cron.','Should Have'],
  ['4','Soft-deleted group disappears from active listings but students remain in the system.','Must Have'],
],
note:null,
related:['campus-create','student-listing']},

{id:'template-create',module:'Test Templates',group:'ASSESSMENT',title:'Create Test Configuration Template',priority:'Must Have',
roles:['all','super-admin','admin','academic'],portals:['Admin Panel'],actors:['Super Admin','Admin','Academic'],
overview:`<p>Test configuration templates are the blueprints for all assessments on the platform. Created exclusively in the Admin Panel by Super Admin, Admin, and Academic roles. <strong>Org Admins in the Client Portal have no access to templates</strong> — they select from existing templates when assigning tests.</p>
<p>A template defines which of the 5 skills are tested, the scoring algorithm, CEFR range and adaptive parameters, per-section time limits, and flags for Veriff ID verification and AI proctoring. Templates are reusable — one template can be assigned to any number of students across any organisation. <strong>Cloning</strong> creates a fully independent copy — editing the clone does not affect the original.</p>`,
fields:[
  {name:'name',type:'Text',req:'Required',valid:'2–100 chars',desc:'Template name shown in the assignment picker and all admin listings'},
  {name:'description',type:'Textarea',req:'Optional',valid:'Max 500 chars',desc:'Internal description for admin reference only — not visible to students'},
  {name:'scoring_method',type:'Dropdown',req:'Required',valid:'adaptive_weighted / language_aware / simple_adaptive / simple_percentage / placement_test / diagnostic',desc:'Algorithm used to calculate CEFR scores and determine question difficulty adjustments'},
  {name:'skills_included',type:'Multi-checkbox',req:'Required',valid:'At least 1 of 5 skills. Adaptive methods require at least 1 diagnostic skill (Language Awareness, Reading, or Listening).',desc:'Which of the 5 skills are included: Language Awareness, Reading, Listening, Writing, Speaking'},
  {name:'cefr_start_level',type:'Dropdown',req:'Required',valid:'Pre-A1 through C2',desc:'Starting CEFR difficulty level when a student begins the test'},
  {name:'evaluation_interval',type:'Number',req:'Required',valid:'Integer 1–10',desc:'Number of questions answered before the system considers a CEFR level change'},
  {name:'min_questions_per_level',type:'Number',req:'Required',valid:'Integer 1–10',desc:'Minimum questions at each CEFR level before the student can move up or down'},
  {name:'move_up_threshold',type:'Number',req:'Required',valid:'0–100 (accuracy percentage)',desc:'Minimum accuracy % at the current level to advance to a higher CEFR level'},
  {name:'move_down_threshold',type:'Number',req:'Required',valid:'0–100 (accuracy percentage)',desc:'Accuracy % below which the student drops to a lower CEFR level'},
  {name:'section_timer_la',type:'Number',req:'Conditional',valid:'2–60 minutes. Required for adaptive_weighted scoring.',desc:'Time limit for the Language Awareness section in minutes'},
  {name:'section_timer_reading',type:'Number',req:'Conditional',valid:'2–60 minutes',desc:'Time limit for the Reading section in minutes'},
  {name:'section_timer_listening',type:'Number',req:'Conditional',valid:'2–60 minutes',desc:'Time limit for the Listening section in minutes'},
  {name:'section_timer_writing',type:'Number',req:'Conditional',valid:'2–60 minutes',desc:'Time limit for the Writing section in minutes'},
  {name:'section_timer_speaking',type:'Number',req:'Conditional',valid:'2–60 minutes',desc:'Time limit for the Speaking section in minutes'},
  {name:'id_verification_required',type:'Toggle',req:'Required',valid:'true / false. Default: false.',desc:'Whether Veriff ID verification must be completed before the student can start the test'},
  {name:'proctoring_required',type:'Toggle',req:'Required',valid:'true / false. Default: false.',desc:'Whether AI proctoring (webcam + screen share via WebRTC) is active during the test session'},
  {name:'default_to_crm_key',type:'Text',req:'Optional',valid:'CRM status code string',desc:'Maps test completion to an external CRM status update — used for CRM-integrated students'},
],
flow:[
  {title:'Navigate to Templates',desc:'Admin/Academic navigates to Admin Panel → Templates → Create Template.'},
  {title:'Select scoring method',desc:'Scoring method determines which configuration fields are shown. Adaptive methods require section timers; diagnostic shows different parameters.'},
  {title:'Select skills',desc:'Admin checks which of the 5 skills to include. System validates that adaptive methods have at least one diagnostic skill (LA, Reading, or Listening).'},
  {title:'Configure adaptive parameters',desc:'Set starting CEFR level, evaluation interval (1–10), min questions per level (1–10), move-up threshold (%), and move-down threshold (%).'},
  {title:'Set section timers',desc:'For each enabled skill: enter the time limit in minutes (valid range: 2–60). Timers are per-section, not a single overall timer.'},
  {title:'Set ID verification and proctoring flags',desc:'Toggle ID Verification Required and Proctoring Required based on the security requirements for this test type.'},
  {title:'Save template',desc:'Template saved as active. Immediately available in the assignment picker across all organisations.'},
  {title:'Clone template (optional)',desc:'Admin selects existing template → Clone. An independent copy created with "Copy of [Name]" title. Changes to clone have no effect on the original.'},
],
rules:[
  {text:'<strong>Access restriction:</strong> Templates are Admin Panel only (super-admin, admin, academic via CASL: templates permission). Org Admins attempting access receive HTTP 403.'},
  {text:'<strong>Diagnostic skill requirement:</strong> Adaptive test types must include at least one diagnostic skill (Language Awareness, Reading, or Listening). Writing and Speaking alone are not sufficient for adaptive methods.'},
  {text:'<strong>Timer range:</strong> Section timers must be between 2 and 60 minutes. Values outside this range are rejected with a field-level error.'},
  {text:'<strong>Max questions per level:</strong> Maximum 10 questions per CEFR level per section.'},
  {text:'<strong>Clone is independent:</strong> Cloned templates are fully independent. Editing the clone does not affect the original and vice versa.'},
  {text:'<strong>Soft delete only:</strong> Deleting a template is soft-delete. Existing student assignments referencing the template are not affected.'},
],
acs:[
  ['1','Valid template saves and is immediately available in the assignment picker.','Must Have'],
  ['2','Adaptive template with no diagnostic skill enabled is rejected with a validation error.','Must Have'],
  ['3','Section timer outside 2–60 minutes is rejected with a field-level error.','Must Have'],
  ['4','Org Admin attempting to access Templates receives HTTP 403.','Must Have'],
  ['5','Cloned template is an independent copy — editing the clone does not change the original.','Must Have'],
],
note:'Writing word limits are planned to be configurable per question (not per template). Currently 200 words applies as a global fallback until the per-question field is implemented on the question API.',

{id:'question-bank',module:'Question Bank',group:'ASSESSMENT',title:'Question Bank Management',priority:'Must Have',
roles:['all','super-admin','admin','academic'],portals:['Admin Panel'],actors:['Super Admin','Admin','Academic'],
overview:`<p>The question bank is the foundational content store for all assessment questions. It is managed exclusively in the Admin Panel by Super Admin, Admin, and Academic roles. <strong>Org Admins have no access to question banks.</strong> Each question is tagged with a skill type and CEFR level and must pass through a <strong>verification lifecycle</strong> before it can be used in a live test session.</p>
<p>Academics create and calibrate questions while Admins and Super Admins verify them. The verification states are: <code>unverified → verified / rejected / re_reviewed → admin_verified</code>. Only <code>verified</code> or <code>admin_verified</code> questions are available to the adaptive engine. Bulk import via CSV is supported with row-level error reporting.</p>`,
fields:[
  {name:'skill_type',type:'Dropdown',req:'Required',valid:'Language Awareness / Reading / Listening / Writing / Speaking',desc:'Which of the 5 assessment skills this question belongs to'},
  {name:'cefr_level',type:'Dropdown',req:'Required',valid:'Pre-A1, A1, A2, A2+, B1, B1+, B2, B2+, C1, C2',desc:'CEFR difficulty level of this question — determines which student level pool it enters'},
  {name:'question_type',type:'Dropdown',req:'Required',valid:'MCQ / gap_fill / true_false / matching / essay / speaking_prompt / listening_passage',desc:'Format of the question — determines what input type the student sees'},
  {name:'question_text',type:'Textarea',req:'Required',valid:'Min 5 chars, max 2000 chars',desc:'The question body or passage text shown to the student'},
  {name:'options',type:'Array',req:'Conditional',valid:'MCQ requires exactly 4 options with exactly 1 marked as correct. Other types not required.',desc:'Answer choices for MCQ questions — exactly one must be marked as the correct answer'},
  {name:'correct_answer',type:'Text',req:'Conditional',valid:'Required for gap_fill, true_false, and matching types',desc:'The correct answer for objective question types'},
  {name:'explanation',type:'Textarea',req:'Optional',valid:'Max 1000 chars',desc:'Explanation of the correct answer — shown to admin reviewers for verification purposes'},
  {name:'tags',type:'Multi-select',req:'Optional',valid:'Predefined tag list',desc:'Metadata tags for categorisation and filtering'},
  {name:'status',type:'System',req:'System',valid:'unverified (default on creation)',desc:'Verification status — set by system and updated by Academic/Admin reviewers'},
],
flow:[
  {title:'Navigate to Question Bank',desc:'Admin/Academic navigates to Admin Panel → Question Bank → Create Question.'},
  {title:'Select skill type and CEFR level',desc:'Admin selects the skill and CEFR level. These determine which assessment context and difficulty pool the question enters.'},
  {title:'Select question type',desc:'Question type selected (MCQ, essay, speaking prompt, etc.). The form fields adapt based on the selected type.'},

{id:'report-generation',module:'Reports & Certificates',group:'RESULTS',title:'Assessment Report & PDF Certificate',priority:'Must Have',
roles:['all','student','org-admin','admin','super-admin'],portals:['Student Portal','Client Portal','Admin Panel'],actors:['System (Celery workers)','Student','OpenAI GPT','SpeechAce API','Firebase FCM','Brevo'],
overview:`<p>After a student completes all sections of an assigned test, the platform automatically generates a comprehensive results report using <strong>Celery background task chains</strong>. The report covers per-skill CEFR band scores, an overall CEFR band (equal-weighted average of completed skills), a skill breakdown, and a proctoring summary for proctored tests.</p>
<p>Generation follows a defined task sequence: objective skills (Language Awareness, Reading, Listening) scored first, then Writing (OpenAI GPT-4/5) and Speaking (SpeechAce + Whisper) run concurrently. Once all tasks complete, <code>generate_final_report_task</code> compiles the overall report and updates the assignment status to <strong>completed</strong>.</p>
<p>The student is notified via Firebase push and Brevo email when ready. A <strong>PDF certificate</strong> is generated on demand via headless Playwright Chromium and cached in S3 — all subsequent requests return the cached version instantly.</p>`,
fields:[
  {name:'report_status',type:'Enum',req:'System',valid:'pending / generating / completed / failed',desc:'Current state of the report generation pipeline'},
  {name:'overall_cefr_band',type:'Enum',req:'System',valid:'Pre-A1, A1, A2, A2+, B1, B1+, B2, B2+, C1, C2',desc:'Final aggregated CEFR band calculated across all completed skills'},
  {name:'skill_scores',type:'Object',req:'System',valid:'Per-skill object: {band, raw_score, status: completed|unanalyzable}',desc:'Individual CEFR band and raw score for each of the 5 skills'},
  {name:'proctoring_summary',type:'Object',req:'System',valid:'Present only for proctored tests',desc:'Summary object with violation counts per violation type'},
],
flow:[
  {title:'Test submission',desc:'Student submits final section. Session status → SUBMITTED. Celery task chain triggered automatically.'},
  {title:'Objective skill scoring',desc:'generate_section_report_task scores Language Awareness, Reading, and Listening using weighted adaptive scoring. CEFR bands calculated per section.'},
  {title:'Productive skill scoring (concurrent)',desc:'generate_writing_report_task sends essay to OpenAI GPT-4/5. generate_speaking_report_task sends audio to SpeechAce API + transcribes via Whisper. Both run concurrently to reduce total generation time.'},
  {title:'Final report compilation',desc:'generate_final_report_task waits for all section tasks. Compiles overall CEFR band = equal-weighted average of completed skill bands. Sets report_status: completed.'},
  {title:'Student notification',desc:'Firebase push notification sent to all registered devices. Brevo email sent with link to the report.'},
  {title:'Student views report',desc:'GET /api/v1/{student_id}/report/{assigned_test_id}. All skill scores, overall band, and proctoring summary displayed.'},
  {title:'PDF certificate on demand',desc:'Student clicks Download Certificate. POST /api/v1/certificate/{assigned_test_id}. Playwright renders HTML → PDF. Uploaded to S3. Presigned URL returned. All subsequent requests return cached S3 version.'},
],
rules:[
  {text:'<strong>Certificate availability:</strong> PDF certificate only accessible when assessment status = completed.'},
  {text:'<strong>Unfinished skills are not blockers:</strong> If writing or speaking was not attempted, those skills are marked unanalyzable. The overall report is still accessible.'},
  {text:'<strong>Reports are permanent:</strong> Reports remain accessible even after account soft-deletion.'},
  {text:'<strong>PDF S3 caching:</strong> Certificate generated once and cached in S3. All subsequent requests return the cached version — no re-generation occurs.'},
  {text:'<strong>Task failure handling:</strong> If a Celery scoring task fails (e.g., SpeechAce API timeout), the failed skill remains pending. Admin must manually trigger re-run.'},
],
acs:[
  ['1','Report generation triggered automatically within 30 seconds of test submission.','Must Have'],
  ['2','Student receives push notification and email within 5 minutes of report completion.','Must Have'],
  ['3','All completed skill scores and overall CEFR band displayed correctly on the report screen.','Must Have'],
  ['4','PDF certificate downloads within 10 seconds of first request.','Must Have'],
  ['5','Second certificate request returns cached S3 version without re-generating.','Should Have'],
  ['6','Unfinished skill shown as unanalyzable — overall report still accessible.','Must Have'],
],
note:'If a Celery scoring task fails, admin-triggered re-run capability should be scoped as a separate feature requirement.',
related:['test-assign','eval-rubric-scoring']},

{id:'payment-web',module:'Packages & Billing',group:'COMMERCE',title:'Web Payment & Checkout',priority:'Must Have',

overview:`<p>Paid packages are purchased via hosted payment gateways. AZE integrates with <strong>PayTabs</strong> (primary) and <strong>Network International</strong> (secondary). The frontend never handles card data — it creates the order and redirects to the gateway's hosted payment page. Payment confirmation arrives <strong>exclusively via HMAC-validated webhook</strong> — the frontend never polls for status.</p>
<p>On successful payment, entitlements are provisioned automatically with no manual admin action required. The student's package balance is updated and test assignment becomes immediately possible.</p>`,
fields:[
  {name:'package_id',type:'Hidden',req:'System',valid:'Selected package ID from the packages listing',desc:'The package being purchased'},
  {name:'gateway',type:'System',req:'System',valid:'paytabs / network_international',desc:'Payment gateway selected by the backend based on configuration'},
  {name:'order_id',type:'UUID',req:'System',valid:'Auto-generated on order creation',desc:'Unique order reference for tracking, reconciliation, and idempotency checks'},
],
flow:[
  {title:'Select package',desc:'Student/Org Admin browses available packages and clicks "Purchase" on desired package.'},
  {title:'Create order',desc:'POST /api/v1/payment/create-order. Payment service creates order record (status: pending) and requests a checkout URL from PayTabs or Network International.'},
  {title:'Redirect to gateway',desc:"Frontend redirects user to the gateway's hosted payment page. All card entry happens on the gateway's PCI-compliant servers — AZE never sees card data."},
  {title:'Gateway webhook received',desc:"After payment attempt, gateway sends HMAC-validated webhook to the AZE payment service backend."},
  {title:'Webhook validation and entitlement',desc:'Backend validates HMAC signature. If valid and payment successful: order status → paid. user_packages record created. Entitlement provisioned. Brevo receipt email sent.'},
  {title:'Redirect to success page',desc:'User redirected back to the platform confirmation page showing updated package balance.'},
  {title:'Payment failure handling',desc:'On failed payment: user redirected to /payment-failed. Order status → failed. Retry option shown.'},
],

  {text:'<strong>Idempotency:</strong> Duplicate webhook calls for the same order_id are silently ignored — entitlement is never double-provisioned.'},
  {text:'<strong>Webhook security:</strong> All webhooks HMAC-validated. Invalid signatures rejected with HTTP 400 and not processed.'},
  {text:'<strong>Automatic provisioning:</strong> No admin action required after a successful payment.'},
],
acs:[
  ['1','Successful payment provisions entitlement automatically within 60 seconds of webhook receipt.','Must Have'],

{id:'eval-rubric-scoring',module:'Human Evaluation',group:'EVALUATION',title:'Rubric Scoring Interface',priority:'Must Have',

overview:`<p>The rubric scoring interface allows evaluators to grade student writing or speaking submissions against CEFR-calibrated dimension rubrics. Sliders for each dimension are adjustable in <strong>0.5 increments only</strong> (0.0 to 5.0 scale). The system auto-calculates a weighted overall score in real time as sliders are adjusted, and maps it to a CEFR level instantly.</p>
<p>For <strong>Writing</strong> tasks: the student's full essay and the question prompt are displayed alongside the rubric. For <strong>Speaking</strong> tasks: an audio player with the student's recording is shown. The AI score is displayed for calibration reference but is overridden by the human score on submission. Optional notes (max 2,000 characters) can be added. <strong>Once submitted, evaluations cannot be edited.</strong></p>`,

  {name:'coherence_organisation',type:'Slider',req:'Both',valid:'0.0 to 5.0 in 0.5 increments only',desc:'Organisation, logical flow, and structural coherence of the response'},
  {name:'language_range',type:'Slider',req:'Both',valid:'0.0 to 5.0 in 0.5 increments only',desc:'Breadth and sophistication of vocabulary and grammatical structures used'},
  {name:'language_accuracy',type:'Slider',req:'Writing',valid:'0.0 to 5.0 in 0.5 increments only',desc:'Writing: Grammatical correctness, spelling accuracy, and punctuation'},
  {name:'style_register',type:'Slider',req:'Writing',valid:'0.0 to 5.0 in 0.5 increments only',desc:'Writing: Appropriateness of tone and register to the communicative context'},
  {name:'task_achievement',type:'Slider',req:'Writing',valid:'0.0 to 5.0 in 0.5 increments only',desc:'Writing: How comprehensively the prompt task requirements were fulfilled'},
  {name:'pronunciation',type:'Slider',req:'Speaking',valid:'0.0 to 5.0 in 0.5 increments only',desc:'Speaking: Clarity, accuracy, and comprehensibility of pronunciation'},
  {name:'oral_fluency',type:'Slider',req:'Speaking',valid:'0.0 to 5.0 in 0.5 increments only',desc:'Speaking: Smoothness, pace, hesitation patterns, and naturalness of speech'},
  {name:'grammar_accuracy_oral',type:'Slider',req:'Speaking',valid:'0.0 to 5.0 in 0.5 increments only',desc:'Speaking: Grammatical correctness in the oral response'},
  {name:'vocabulary_range_oral',type:'Slider',req:'Speaking',valid:'0.0 to 5.0 in 0.5 increments only',desc:'Speaking: Breadth and appropriateness of vocabulary in the oral response'},
  {name:'evaluator_notes',type:'Textarea',req:'Optional',valid:'Maximum 2,000 characters',desc:'Optional qualitative feedback or observations from the evaluator — not shown to students'},
],
flow:[
  {title:'Open task',desc:'Reviewer clicks a task from the queue. Task detail screen loads with the student submission and rubric sliders.'},
  {title:'Review submission',desc:'For writing: read the essay and the question prompt. For speaking: play the audio recording. The AI-generated score is displayed alongside for calibration reference.'},
  {title:'Adjust dimension sliders',desc:'Evaluator moves each dimension slider to their assessment. Overall score auto-calculates in real time using the weighted formula: (Σ score × weight) / (Σ max possible) × 20 = score out of 100.'},
