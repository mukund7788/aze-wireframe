// ── COMPLIANCE ─────────────────────────────────────────────────────────────────
{id:'gdpr-requests',module:'GDPR & Privacy',group:'COMPLIANCE',title:'Data Download & Account Deletion Requests',priority:'Must Have',
roles:['all','student','super-admin','admin','compliance'],portals:['Student Portal (request)','Admin Panel (approve)'],actors:['Student','Super Admin','Admin','Compliance Manager','System (S3)'],
overview:`<p>Students have the right to request deletion of their account and/or a download of their personal data in compliance with GDPR. Requests are submitted from <strong>Settings → Privacy</strong> and enter an admin review queue. Requests are not processed automatically — they require explicit approval from a Super Admin, Admin, or Compliance Manager.</p>
<p>On deletion approval, all <strong>biometric data</strong> (speaking audio recordings and proctoring screenshots stored in S3) is <strong>permanently and irreversibly deleted</strong>. The core database record is soft-deleted (is_deleted: true) rather than physically removed, preserving referential integrity for historical reports and audit logs. Data download requests currently require manual admin handling — automated export is a known gap.</p>`,
fields:[
  {name:'request_type',type:'Radio',req:'Required',valid:'data_download / account_deletion',desc:'Type of GDPR request — data download or full account deletion'},
  {name:'reason',type:'Textarea',req:'Optional',valid:'Max 500 chars',desc:"Student's stated reason for the request — optional, for admin reference"},
],
flow:[
  {title:'Student submits request',desc:'Student navigates to Settings → Privacy. Selects request type and optionally provides a reason. Submits form.'},
  {title:'Request logged',desc:'Request record created with status: pending. Student shown confirmation that their request has been received.'},
  {title:'Admin queue notification',desc:'Super Admin / Admin / Compliance Manager sees the new request in Admin Panel → Requests queue.'},
  {title:'Admin reviews request',desc:'Admin views the request: student name, email, request type, submission date.'},
  {title:'Admin approves deletion',desc:"Admin clicks Approve. For account deletion: system initiates S3 biometric data deletion for all the student's associated files."},
  {title:'S3 biometric data permanently deleted',desc:"All objects under the student's S3 prefixes permanently deleted: speechace_audios/{student_id}/, and all proctoring_events entries for the student's sessions."},
  {title:'Account soft-deleted',desc:'users.is_deleted set to true. Student cannot log in. Account data preserved in database for referential integrity.'},
  {title:'Confirmation email sent',desc:'Brevo email sent to student confirming deletion has been completed.'},
],
rules:[
  {text:'<strong>S3 deletion is triggered by admin approval</strong> — not by student request submission. Requires explicit admin action.'},
  {text:'<strong>S3 deletion is permanent and irreversible.</strong> Once biometric data is deleted it cannot be recovered under any circumstances.'},
  {text:'<strong>Core record uses soft-delete:</strong> Database record gets is_deleted: true — not physically removed. Historical reports and audit logs are preserved.'},
  {text:'<strong>Reports preserved after deletion:</strong> Historical assessment results and reports remain accessible to admins even after account deletion.'},
  {text:'<strong>No auto-approve:</strong> No automated approval mechanism exists. Admin must actively review and approve each request.'},
  {text:'<strong>Data download is manual:</strong> No automated export tool. Admin manually compiles and sends the data export for download requests — this is a known compliance gap.'},
  {text:'<strong>Compliance Manager access:</strong> Compliance Managers have access to the Requests queue and can approve or reject deletion/download requests.'},
],
acs:[
  ['1','Student can submit a deletion request from Settings → Privacy.','Must Have'],
  ['2','Deletion request appears in the Admin Panel Requests queue.','Must Have'],
  ['3','On admin approval, all S3 audio files and proctoring images for the student are permanently deleted.','Must Have'],
  ['4','Core account record is soft-deleted — login is blocked but historical data is preserved.','Must Have'],
  ['5','Student receives confirmation email after deletion processing is complete.','Should Have'],
],
note:'Automated GDPR data export is a known open gap — all data download requests require manual admin handling. An automated export feature should be scoped as a separate requirement.',
related:['audit-logs']},

{id:'audit-logs',module:'Activity Logs & Audit Trail',group:'COMPLIANCE',title:'Activity Logs & Audit Trail',priority:'Must Have',
roles:['all','super-admin','admin','compliance'],portals:['Admin Panel'],actors:['Super Admin','Admin','Compliance Manager'],
overview:`<p>Every create, update, and delete action performed by any administrator in the Admin Panel is <strong>automatically logged</strong> in an append-only audit trail. Logs cannot be edited or deleted — enforced at the database level via a RESTRICT foreign key constraint. Field-level before/after JSON snapshots are stored for all update operations, providing a complete forensic record.</p>
<p><strong>Org Admins do not have audit log access.</strong> Access requires the explicit <code>activitylogs</code> CASL permission key (Super Admin, Admin). Compliance Managers have read and export access. The audit trail is a platform-level Admin Panel feature — not available in the Client Portal.</p>`,
fields:[
  {name:'date_from',type:'Date',req:'Optional',valid:'Start of the date range filter',desc:'Filter audit log entries from this date onwards'},
  {name:'date_to',type:'Date',req:'Optional',valid:'End of the date range filter',desc:'Filter audit log entries up to and including this date'},
  {name:'action_type',type:'Dropdown',req:'Optional',valid:'created / modified / deleted / view',desc:'Filter by the type of action that was performed'},
  {name:'module_filter',type:'Dropdown',req:'Optional',valid:'List of all Admin Panel modules',desc:'Filter by which Admin Panel module the action was performed in'},
  {name:'user_filter',type:'Dropdown',req:'Optional',valid:'List of admin users on the platform',desc:'Filter by which administrator performed the action'},
],
flow:[
  {title:'Admin performs action',desc:'Any create, update, or delete operation in any Admin Panel module (questions, templates, students, staff, packages, etc.).'},
  {title:'Automatic log creation',desc:'System automatically creates an audit_logs record: user_id, role_id, IP address, action name, action type (created/modified/deleted), target entity ID, timestamp.'},
  {title:'Field-level change snapshot',desc:'For update operations: audit_log_details records created with before and after JSON snapshots of all changed fields. Sensitive fields excluded.'},
  {title:'View and filter logs',desc:'Admin navigates to Admin Panel → Activity Logs. Applies date range, action type, module, and user filters. Results paginated.'},
  {title:'Export to CSV',desc:'Admin clicks Export. GET /api/v1/export/audit-logs with all current filter params applied. CSV file downloaded.'},
],
rules:[
  {text:'<strong>Append-only:</strong> Audit logs cannot be edited or deleted — enforced by a RESTRICT foreign key constraint at the database level.'},
  {text:'<strong>Access control:</strong> super-admin and admin with activitylogs CASL permission. Compliance Manager has read and export access. Org Admin has NO access.'},
  {text:'<strong>Org Admin blocked:</strong> Org Admin attempting to view Activity Logs receives HTTP 403.'},
  {text:'<strong>Field-level granularity:</strong> Update operations record before and after values as JSON. Sensitive fields (passwords, tokens, secrets) are excluded from snapshots.'},
],
acs:[
  ['1','Every admin create/update/delete generates an audit log entry automatically.','Must Have'],
  ['2','Audit log entry includes: user, role, IP address, action, target entity, and timestamp.','Must Have'],
  ['3','Date range, action type, module, and user filters work correctly and can be combined.','Must Have'],
  ['4','CSV export downloads all log entries matching the current filter combination.','Should Have'],
  ['5','Org Admin attempting to access Activity Logs receives HTTP 403.','Must Have'],
],
note:null,
related:['gdpr-requests']},

// ── COMMUNICATIONS ─────────────────────────────────────────────────────────────
{id:'notifications',module:'Notifications',group:'COMMUNICATIONS',title:'In-App, Push & Email Notifications',priority:'Must Have',
roles:['all','student','org-admin','admin','super-admin'],portals:['Student Portal','Admin Panel','Client Portal'],actors:['System (Celery tasks)','Firebase FCM','Brevo'],
overview:`<p>The platform delivers three notification channels that operate independently — failure in one does not prevent the others from delivering. <strong>In-app notifications</strong> appear in the bell icon in the portal navigation. <strong>Firebase Cloud Messaging (FCM) push notifications</strong> are sent to browser and mobile devices. <strong>Transactional emails</strong> are sent via Brevo with subdomain-aware links.</p>
<p>Key event triggers include: assessment report ready, test assigned, test reminder (manual), password reset link, staff invitation, invoice sent, and payment receipt. Push notifications are silently skipped if the student has not granted browser notification permission — no error is returned to the system. Admins and Super Admins can bulk-send in-app notifications to up to <strong>400 students per batch</strong>.</p>`,
fields:[
  {name:'notification_type',type:'Enum',req:'System',valid:'report_ready / test_assigned / reminder / password_reset / invitation / invoice_sent / payment_receipt / bulk_admin',desc:'The event type that triggered the notification — determines title and body template'},
  {name:'title',type:'Text',req:'System',valid:'Auto-generated per event type from templates',desc:'Notification title displayed in the bell icon list and push notification header'},
  {name:'body',type:'Text',req:'System',valid:'Auto-generated per event type from templates',desc:'Notification body text with contextual details'},
  {name:'is_read',type:'Boolean',req:'System',valid:'Default: false on creation. Updated to true by student action.',desc:'Whether the student has read the notification — controls unread count badge'},
  {name:'fcm_token',type:'System',req:'System',valid:'Registered per device per login session',desc:'Firebase Cloud Messaging token — registered when student grants notification permission'},
],
flow:[
  {title:'System event triggers notification',desc:'e.g., generate_final_report_task Celery task completes. Notification creation triggered programmatically.'},
  {title:'In-app notification created',desc:'Record inserted into notifications table with type, title, body, user_id, is_read: false. Bell icon badge count incremented in real-time.'},
  {title:'Push notification sent',desc:'FCM token (registered per device on login) used to send push via Firebase Cloud Messaging. If no FCM token registered or permission denied: silently skipped — no error.'},
  {title:'Transactional email sent',desc:'Brevo sends email using the appropriate Jinja2 HTML template. All links in the email are subdomain-aware — point to the correct org subdomain.'},
  {title:'Student reads notification',desc:'Student clicks bell icon → notification list shown. Clicking a notification marks it read via PATCH /api/v1/notifications/{id}/read.'},
  {title:'Mark all as read',desc:'Student clicks "Mark all read" → POST /api/v1/notifications/read-all. All unread notifications set to is_read: true. Badge clears immediately.'},
],
rules:[
  {text:'<strong>FCM token per device per session:</strong> Registered on each login. Multiple devices = push notifications sent to all registered tokens for that user.'},
  {text:'<strong>Push permission required:</strong> Push notification silently skipped if student has not granted browser notification permission. No error raised.'},
  {text:'<strong>Notifications never hard-deleted:</strong> Soft-delete pattern applies — notifications remain in the database permanently.'},
  {text:'<strong>Email delivery failures non-blocking:</strong> A failed Brevo email delivery does not fail the parent operation (e.g., a failed report email does not fail report generation).'},
  {text:'<strong>Bulk send limit:</strong> Admin bulk-send to students is batched at 400 per run to prevent system overload.'},
],
acs:[
  ['1','Report ready triggers both push notification and email to student within 5 minutes.','Must Have'],
  ['2','Test assigned creates an in-app notification for the student within 60 seconds.','Must Have'],
  ['3','Marking all notifications as read clears the unread count badge immediately.','Must Have'],
  ['4','Push notification silently skipped (no error) when student denied browser permission.','Must Have'],
  ['5','Admin bulk-send delivers in-app notifications to up to 400 students per batch.','Should Have'],
],
note:null,
related:['report-generation','test-assign']},

{id:'la-assessment',module:'Language Awareness Assessment',group:'TEST TAKING',title:'Language Awareness Assessment',priority:'Must Have',
roles:['all','student'],portals:['Student Portal'],actors:['Student','System','AI Adaptive Engine'],
overview:`<p>The Language Awareness (LA) section tests grammar, vocabulary, and English language knowledge through adaptive question delivery. LA is a <strong>diagnostic skill</strong> — required in all adaptive test templates. Questions are served one at a time and the CEFR difficulty level adjusts in real time based on the student's accuracy using the configured move-up and move-down thresholds.</p>
<p>Question types include: MCQ (four options, one correct), gap-fill (type or drag a missing word), sentence transformation, matching pairs, and drag-and-drop word arrangement (DragDropWords component). Answer drafts are auto-saved to <code>sessionStorage</code> under the key <code>la_draft_{assignedTestId}</code> to protect against accidental page refreshes.</p>`,

  {name:'question_text',type:'Display',req:'System',valid:'Served by adaptive engine at the current CEFR level',desc:'The question body, sentence, or language task presented to the student'},
  {name:'answer_options',type:'Radio / Drag-Drop / Text Input',req:'Required',valid:'MCQ: select one of four. Gap-fill: type or drag. Matching: pair items.',desc:'Student response input — format adapts to the question type'},
  {name:'section_timer',type:'Display',req:'System',valid:'Backend-authoritative countdown synced every 30 seconds',desc:'Countdown timer in the top bar. Source of truth is the server.'},
  {name:'question_progress',type:'Display',req:'System',valid:'Current question number / estimated total',desc:'Progress bar and counter showing how far through the section the student is'},

{id:'global-timer',module:'Global Timer & Auto-Submit',group:'TEST TAKING',title:'Global Timer & Auto-Submit',priority:'Must Have',
roles:['all','student'],portals:['Student Portal'],actors:['Student','System','Celery (safety net)'],
overview:`<p>All timed assessment sections use a <strong>backend-authoritative global timer</strong>. The server is the source of truth for remaining time — the frontend displays a synchronised countdown but does not own the timer state. This prevents students from gaining extra time by manipulating their local clock or pausing the browser.</p>
<p>The frontend sends a <strong>heartbeat every 30 seconds</strong> (POST /api/v1/adaptive-questions/heartbeat) to keep the session alive and sync remaining time from the backend. If the frontend timer hits zero, auto-submit is triggered immediately. A backend <strong>Celery safety-net cron</strong> (daily at 00:05) force-submits any sessions where the timer has expired but no final submit was received — preventing sessions from staying open indefinitely after browser crashes.</p>`,
fields:[
  {name:'remaining_time_seconds',type:'Display',req:'System',valid:'Synced from backend every 30 seconds via heartbeat response',desc:'Live countdown shown in the AssessmentTopBarWithSectionTimer component'},
  {name:'total_duration_seconds',type:'System',req:'System',valid:'Set from template section timer (2–60 minutes converted to seconds)',desc:'Configured total duration for the section — set at template creation'},
  {name:'heartbeat_interval_ms',type:'System',req:'System',valid:'30,000 ms (30 seconds)',desc:'How frequently the frontend sends a heartbeat to the backend'},
  {name:'max_pause_seconds',type:'System',req:'System',valid:'1,200 seconds cumulative maximum across the entire session',desc:'Maximum total pause time allowed — tracked server-side. Cumulative across all pauses, not per-section.'},
],
flow:[
  {title:'Section timer initialised',desc:'Assessment opens. Frontend calls POST /api/v1/test-session/time to get initial remaining_time_seconds from backend. Countdown begins.'},
  {title:'Heartbeat every 30 seconds',desc:'POST /api/v1/adaptive-questions/heartbeat sent every 30 seconds. Response returns updated remaining_time_seconds. Frontend countdown resynced.'},
  {title:'Network interruption (pause)',desc:'If network drops: timer status set to paused. Pause duration tracked server-side. Cumulative pause cannot exceed 1,200 seconds (20 minutes) total.'},
  {title:'Frontend timer reaches zero',desc:'Frontend countdown hits 0. POST /api/v1/submit-interval-data with is_lastset: true, auto_submit: true. Section auto-submitted with all answers received so far.'},
  {title:'Backend safety-net cron',desc:'auto_submit_expired_tests cron runs daily at 00:05. Any session where backend-calculated remaining time ≤ 0 but no final submit received: backend force-submits the session.'},
],
rules:[
  {text:'<strong>Backend is authoritative:</strong> The server owns the timer. Frontend countdown is purely a display. Manipulating the client-side clock has zero effect.'},
  {text:'<strong>Heartbeat grace period:</strong> A single missed heartbeat does not terminate the session — a 30-second grace period applies before the session is considered interrupted.'},
  {text:'<strong>Max pause is cumulative:</strong> 1,200 seconds total across the entire session, not per-section. Exceeding this can result in auto-submit.'},

],

],

{id:'test-security',module:'Test Security & Anti-Cheat',group:'TEST SECURITY',title:'Test Security & Anti-Cheat Enforcement',priority:'Must Have',
roles:['all','student'],portals:['Student Portal'],actors:['Student','System'],
overview:`<p>Throughout every assessment section — proctored or not — a comprehensive set of browser-level security controls enforces academic integrity. These activate as soon as a student enters any assessment route and are removed only after the section is submitted.</p>
<p>Security operates at three levels: <strong>(1) Keyboard & clipboard blocking</strong> — copy-paste, keyboard shortcuts (Ctrl+C, Ctrl+V, Ctrl+S, Ctrl+P, F12, Ctrl+Shift+I) all disabled. <strong>(2) UI interaction blocking</strong> — right-click context menu, drag-and-drop text selection (initDragGuard() called on app boot), all blocked globally. <strong>(3) Window & screen enforcement</strong> — fullscreen lock, tab-switch and window-blur detection. For proctored tests, AI-based visual and audio monitoring add a fourth layer (documented in AI Proctoring).</p>`,

  {name:'copy_paste_blocked',type:'System',req:'System',valid:'Always active on all assessment routes',desc:'Ctrl+C, Ctrl+V, Ctrl+X disabled via event listeners — prevents copying questions or pasting external content.'},

  {name:'context_menu_blocked',type:'System',req:'System',valid:'Always active on all assessment routes',desc:'Right-click context menu disabled entirely (contextmenu event prevented).'},

  {name:'fullscreen_enforced',type:'System',req:'System',valid:'All assessment routes require fullscreen',desc:'document.requestFullscreen() called on section start. Exiting fullscreen shows a blocking modal — test paused until fullscreen re-entered.'},
  {name:'tab_switch_detection',type:'System',req:'System',valid:'Proctored tests: 1 occurrence = TERMINATED_SECURITY. Non-proctored: warning shown.',desc:'window blur and visibilitychange events monitored. First tab-switch on proctored test terminates session immediately.'},

],

  {title:'Assessment route entered',desc:'Student navigates to an assessment page. useCopyPasteProtection() hook attaches event listeners: copy, cut, paste, contextmenu, and keydown (for all blocked keyboard shortcuts).'},

// ── APP LOGIC ──────────────────────────────────────────────────────────────────
let curRole='all',curFeature=null,srchTerm='';
function getFeats(r){return FEATURES.filter(f=>r==='all'||f.roles.includes(r))}
function pc(p){return p==='Must Have'?'tag-must':'tag-should'}
function reqCls(r){const m={Required:'fld-r',Optional:'fld-o',System:'fld-sys',Conditional:'fld-r',Display:'fld-o',Both:'fld-r',Writing:'fld-r',Speaking:'fld-r',Hidden:'fld-sys'};return m[r]||'fld-o'}

function renderRoles(){
  document.getElementById('role-switcher').innerHTML=ROLES.map(r=>`
    <button class="role-btn ${r.id===curRole?'active':''}" onclick="selRole('${r.id}')">
      <span class="role-dot" style="background:${r.dot}"></span>${r.label}
    </button>`).join('');
}

function renderNav(){
  const feats=getFeats(curRole);
  let html='';
  GROUPS.forEach(grp=>{
    const gf=feats.filter(f=>f.group===grp.id);
    if(!gf.length)return;
    const modules=[...new Set(gf.map(f=>f.module))];
    html+=`<div class="nav-group-label">${grp.label}</div>`;
    modules.forEach(mod=>{
      const mf=gf.filter(f=>f.module===mod);
      mf.forEach(f=>{
        const hidden=srchTerm&&!f.title.toLowerCase().includes(srchTerm)&&!f.module.toLowerCase().includes(srchTerm)?'hidden':'';
        html+=`<button class="nav-feature ${f.id===curFeature?'active':''} ${hidden}" onclick="selFeat('${f.id}')">
          <span class="nf-dot"></span>${f.title}
        </button>`;
      });
    });
  });
  document.getElementById('lnav-scroll').innerHTML=html;
}

function selRole(r){
  curRole=r;curFeature=null;
  renderRoles();renderNav();showWelcome();
}

function selFeat(id){
  curFeature=id;renderNav();
  const f=FEATURES.find(x=>x.id===id);
  if(!f)return;
  const rolesTag=f.roles.filter(r=>r!=='all').map(r=>{const rd=ROLES.find(x=>x.id===r);return`<span class="tag tag-role">${rd?rd.label:r}</span>`;}).join('');
  const portalsTag=f.portals.map(p=>`<span class="tag tag-portal">${p}</span>`).join('');
  const actorsHtml=f.actors.map(a=>`<span class="actor-chip">${a}</span>`).join('');
  let fieldsHtml='';
  if(f.fields&&f.fields.length){
    fieldsHtml=`<div class="doc-section"><div class="doc-section-title">UI Fields & Data Model</div>
      <table class="fields-table">
        <thead><tr><th style="width:140px">Field</th><th style="width:90px">Type</th><th style="width:90px">Required</th><th style="width:220px">Validation</th><th>Description</th></tr></thead>
        <tbody>${f.fields.map(fd=>`<tr>
          <td><span class="fld-name">${fd.name}</span></td>
          <td style="color:rgba(255,255,255,0.45);font-size:11px">${fd.type}</td>
          <td><span class="fld-req ${reqCls(fd.req)}">${fd.req}</span></td>
          <td style="color:rgba(255,255,255,0.40);font-size:11px;line-height:1.5">${fd.valid}</td>
          <td>${fd.desc}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
  }
  const flowHtml=f.flow?`<div class="doc-section"><div class="doc-section-title">Functional Flow</div>
    <div class="flow-steps">${f.flow.map((s,i)=>`<div class="flow-step">
      <div class="flow-num-wrap"><div class="flow-num">${i+1}</div></div>
      <div class="flow-body">
        <div class="flow-body-title">${s.title}</div>
        <div class="flow-body-desc">${s.desc}</div>
      </div></div>`).join('')}</div></div>`:'';
  const rulesHtml=f.rules?`<div class="doc-section"><div class="doc-section-title">Business Rules & Constraints</div>
    <div class="rule-list">${f.rules.map(r=>`<div class="rule-item"><div class="rule-dot"></div><div class="rule-text">${r.text}</div></div>`).join('')}</div></div>`:'';
  const acsHtml=f.acs?`<div class="doc-section"><div class="doc-section-title">Acceptance Criteria</div>
    <table class="ac-table">
      <thead><tr><th style="width:32px;text-align:center">#</th><th>Criterion</th><th style="width:120px;text-align:center">Priority</th></tr></thead>
      <tbody>${f.acs.map(([n,c,p])=>`<tr>
        <td style="text-align:center;color:rgba(255,255,255,0.28);font-weight:700">${n}</td>
        <td>${c}</td><td style="text-align:center"><span class="tag ${pc(p)}">${p}</span></td>
      </tr>`).join('')}</tbody></table></div>`:'';
  const relatedHtml=f.related&&f.related.length?`<div class="doc-section"><div class="doc-section-title">Related Features</div>
    <div class="related-row">${f.related.map(rid=>{const rf=FEATURES.find(x=>x.id===rid);return rf?`<span class="related-chip" onclick="selFeat('${rid}')">${rf.title} →</span>`:'';}).join('')}</div></div>`:'';
  const noteHtml=f.note?`<div class="note-box"><p>⚠ <strong>Note:</strong> ${f.note}</p></div>`:'';
  document.getElementById('content-wrap').innerHTML=`
    <div class="feat-header">
      <div class="feat-breadcrumb"><span>${f.group}</span> › <span>${f.module}</span></div>
      <div class="feat-title">${f.title}</div>
      <div class="feat-meta"><span class="tag tag-module">${f.module}</span><span class="tag ${pc(f.priority)}">${f.priority}</span>${portalsTag}${rolesTag}</div>
    </div>
    <div class="doc-section"><div class="doc-section-title">Overview</div><div class="overview-text">${f.overview}</div></div>
    <div class="doc-section"><div class="doc-section-title">Actors</div><div class="actors-row">${actorsHtml}</div></div>
    ${fieldsHtml}${flowHtml}${rulesHtml}${acsHtml}${relatedHtml}${noteHtml}`;
  document.getElementById('main').scrollTop=0;
}

function showWelcome(){
  const r=ROLES.find(x=>x.id===curRole);
  const feats=getFeats(curRole);
  const must=feats.filter(f=>f.priority==='Must Have').length;
  const should=feats.filter(f=>f.priority==='Should Have').length;
  const mods=[...new Set(feats.map(f=>f.module))].length;
  document.getElementById('content-wrap').innerHTML=`<div class="welcome">
    <div class="w-icon">📋</div>
    <h2>AZE Platform Feature Documentation</h2>
    <p>Select a feature from the left navigation to view detailed documentation including field definitions, functional flows, business rules, and acceptance criteria.</p>
    <div class="welcome-grid">
      <div class="welcome-card"><div class="wc-label">Features for ${r?r.label:'All'}</div><div class="wc-val">${feats.length}</div></div>
      <div class="welcome-card"><div class="wc-label">Must Have</div><div class="wc-val" style="color:#f87171">${must}</div></div>
      <div class="welcome-card"><div class="wc-label">Modules covered</div><div class="wc-val" style="color:#c4a0ff">${mods}</div></div>
    </div>
  </div>`;
  document.getElementById('main').scrollTop=0;
}

function doSearch(val){
  srchTerm=val.toLowerCase().trim();
  renderNav();
  if(curFeature){
    const f=FEATURES.find(x=>x.id===curFeature);
    if(f&&srchTerm&&!f.title.toLowerCase().includes(srchTerm)&&!f.module.toLowerCase().includes(srchTerm)){
      curFeature=null;showWelcome();
    }
  }
}

function toggleTheme(){document.body.classList.toggle('light')}

// Init
renderRoles();renderNav();showWelcome();
</script>
</body>
</html>
