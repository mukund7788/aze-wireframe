<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZE Admin Portal - Question Fields</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>

    :root {
      --background: #030712;
      --foreground: #f8fafc;
      --sidebar-bg: #040817;
      --sidebar-border: #111c35;
      --card-bg: #060d1f;
      --card-border: #131f38;
      --table-header: #0d172e;
      --table-row-hover: #0a142c;
      --table-border: #111d38;
      --input-bg: #070e20;
      --input-border: #17233f;
      --input-focus: #06b6d4;
      --primary: #06b6d4;
      --primary-hover: #0891b2;
      --primary-text: #04111d;
      --muted-text: #94a3b8;
      --dim-text: #64748b;
      --border-subtle: #17233f;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --font-poppins: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-poppins);
      background-color: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.4);
    }

    .app-shell {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Left Sidebar */
    .app-sidebar {
      width: 240px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      user-select: none;
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .app-sidebar.sidebar-collapsed {
      width: 68px;
    }

    .sidebar-header {
      height: 56px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--sidebar-border);
      overflow: hidden;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .brand-logo-mini {
      display: none;
      font-size: 20px;
      font-weight: 800;
      color: #06b6d4;
    }

    .sidebar-collapsed .brand-logo-text {
      display: none;
    }
    .sidebar-collapsed .brand-logo-mini {
      display: block;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      color: var(--muted-text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 2px;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
    }

    .sidebar-collapsed .sidebar-item {
      justify-content: center;
      padding: 10px 0;
    }

    .sidebar-collapsed .sidebar-item span {
      display: none;
    }

    .sidebar-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
    }

    .sidebar-item svg {
      width: 16px;
      height: 16px;
      color: inherit;
      flex-shrink: 0;
    }

    .sidebar-group-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 12px 4px;
      color: var(--dim-text);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .sidebar-collapsed .sidebar-group-label {
      display: none;
    }

    .sidebar-subitem {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px 7px 32px;
      border-radius: var(--radius-md);
      color: var(--muted-text);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 1px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .sidebar-collapsed .sidebar-subitem {
      justify-content: center;
      padding: 9px 0;
    }

    .sidebar-collapsed .sidebar-subitem span {
      display: none;
    }

    .sidebar-subitem:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
    }

    .sidebar-subitem.active {
      background: rgba(6, 182, 212, 0.12);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.25);
      font-weight: 600;
    }

    .sidebar-subitem svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--sidebar-border);
    }

    .sidebar-collapsed .sidebar-footer {
      padding: 14px 8px;
      text-align: center;
    }

    .sidebar-collapsed .logout-btn span {
      display: none;
    }

    .logout-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ef4444;
      font-size: 12.5px;
      font-weight: 500;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color 0.15s ease;
      width: 100%;
    }

    .logout-btn:hover {
      color: #f87171;
    }

    .logout-btn svg {
      width: 15px;
      height: 15px;
    }

    /* Main Area */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .top-navbar {
      height: 56px;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--sidebar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-btn-ghost {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted-text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn-ghost:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border-color: var(--border-subtle);
    }

    .icon-btn-ghost.active {
      background: rgba(6, 182, 212, 0.12);
      color: #06b6d4;
      border-color: rgba(6, 182, 212, 0.3);
    }

    .icon-btn-ghost svg {
      width: 16px;
      height: 16px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #070e20;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 6px 12px;
      font-size: 12.5px;
      color: var(--dim-text);
      width: 220px;
      cursor: text;
    }

    .nav-search-bar svg {
      width: 14px;
      height: 14px;
      color: var(--dim-text);
    }

    .kbd-pill {
      margin-left: auto;
      font-size: 10px;
      font-family: var(--font-mono);
      background: #111c38;
      color: #94a3b8;
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid #1e2c4f;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 8px;
      border-radius: 9999px;
      border: 1px solid var(--border-subtle);
      background: #070e20;
      cursor: pointer;
    }

    .user-avatar-circle {
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px 40px;
    }

    /* Page Header */
    .page-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 18px;
    }

    .page-title h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
    }

    .page-title p {
      font-size: 13px;
      color: var(--muted-text);
      margin-top: 3px;
    }

    .header-actions-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .custom-select-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #070e20;
      border: 1px solid var(--border-subtle);
      color: #f1f5f9;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .custom-select-trigger:hover {
      border-color: rgba(6, 182, 212, 0.4);
    }

    .btn-aze-outline {
      display: flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-aze-outline:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: #2a3a5f;
      color: #fff;
    }

    .btn-aze-outline svg {
      width: 14px;
      height: 14px;
    }

    .btn-aze-primary {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #06b6d4;
      border: 1px solid #06b6d4;
      color: #04111d;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(6, 182, 212, 0.3);
      transition: all 0.15s ease;
    }

    .btn-aze-primary:hover {
      background: #0891b2;
      border-color: #0891b2;
    }

    .btn-aze-primary svg {
      width: 15px;
      height: 15px;
    }

    /* Skills Segmented Bar matching Screenshot 1 (media_1791454128881.png) */
    .skills-segmented-bar {
      display: inline-flex;
      align-items: center;
      background: #0d1527;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 3px;
      gap: 2px;
      margin-bottom: 18px;
    }

    .skill-segment-btn {
      padding: 5px 14px;
      border-radius: 4px;
      font-size: 12.5px;
      font-weight: 500;
      color: #94a3b8;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .skill-segment-btn:hover {
      color: #f1f5f9;
    }

    .skill-segment-btn.active {
      background: #06b6d4;
      color: #020817;
      font-weight: 600;
    }

    /* Subtabs Line Bar */
    .subtabs-line-bar {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 18px;
      gap: 4px;
      position: relative;
    }

    .subtab-item-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--muted-text);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: -1px;
      white-space: nowrap;
    }

    .subtab-item-btn:hover {
      color: #f1f5f9;
    }

    .subtab-item-btn.active {
      color: #fff;
      border-bottom: 2px solid #06b6d4;
      font-weight: 600;
    }

    .subtab-more-btn {
      margin-left: auto;
      padding: 6px;
      background: transparent;
      border: none;
      color: var(--dim-text);
      cursor: pointer;
    }

    /* CEFR Distribution Bar (media_1791295917539.png) */
    .cefr-distribution-card {
      display: flex;
      align-items: center;
      background: #060d1f;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 6px 12px;
      margin-bottom: 16px;
      gap: 8px;
      overflow-x: auto;
    }

    .cefr-dist-item {
      display: flex;
      align-items: center;
      border-radius: var(--radius-sm);
      overflow: hidden;
      font-size: 12px;
      font-family: var(--font-mono);
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex: 1;
      min-width: 90px;
    }

    .cefr-dist-label {
      padding: 3px 8px;
      font-weight: 700;
      font-size: 11px;
    }

    .cefr-dist-count {
      padding: 3px 10px;
      background: #091226;
      color: #f8fafc;
      font-weight: 600;
      flex: 1;
      text-align: center;
    }

    .dist-a1 .cefr-dist-label { background: #451a03; color: #fb923c; }
    .dist-a2 .cefr-dist-label { background: #311042; color: #e879f9; }
    .dist-b1 .cefr-dist-label { background: #3b1807; color: #f59e0b; }
    .dist-b2 .cefr-dist-label { background: #064e3b; color: #34d399; }
    .dist-c1 .cefr-dist-label { background: #2e1065; color: #c084fc; }
    .dist-c2 .cefr-dist-label { background: #065f46; color: #6ee7b7; }

    /* Card Container */
    .aze-card-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .aze-card-container.is-fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1000;
      border-radius: 0;
      overflow-y: auto;
    }

    /* Toolbar */
    .aze-table-toolbar {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      background: #060e22;
      flex-wrap: wrap;
      gap: 12px;
    }

    .table-search-box {
      position: relative;
      width: 320px;
      display: flex;
      align-items: center;
    }

    .table-search-box svg {
      position: absolute;
      left: 11px;
      width: 15px;
      height: 15px;
      color: var(--dim-text);
      pointer-events: none;
    }

    .table-search-box input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      padding: 7px 32px 7px 34px;
      color: #fff;
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
      transition: all 0.15s ease;
    }

    .table-search-box input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.15);
    }

    .search-clear-btn {
      position: absolute;
      right: 9px;
      background: transparent;
      border: none;
      color: var(--dim-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
    }

    .search-clear-btn:hover {
      color: #fff;
    }

    .table-tools-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ToggleGroup for View Mode (Table vs Grid) matching Screenshot 1 */
    .view-toggle-group {
      display: flex;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
      background: #141d2f;
      height: 28px;
    }

    .view-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 100%;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
      color: #64748b;
    }

    .view-toggle-btn svg {
      width: 14px;
      height: 14px;
      stroke: #64748b;
    }

    .view-toggle-btn.active {
      background: #06b6d4;
      color: #020817;
    }

    .view-toggle-btn.active svg {
      stroke: #020817;
    }

    /* Density Switcher matching Screenshot 1 */
    .density-pill-group {
      display: flex;
      align-items: center;
      background: #141d2f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 2px;
      height: 28px;
      box-sizing: border-box;
      gap: 2px;
    }

    .density-btn {
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      height: 22px;
      line-height: 18px;
    }

    .density-btn.active {
      background: #06b6d4;
      color: #020817;
      font-weight: 600;
    }

    /* Bulk Action Bar */
    .bulk-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(6, 182, 212, 0.1);
      border-bottom: 1px solid rgba(6, 182, 212, 0.25);
      padding: 8px 18px;
      font-size: 12.5px;
      color: #38bdf8;
    }

    .bulk-action-bar button {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: #0a1733;
      border: 1px solid #1e3a66;
      color: #e0f2fe;
    }

    .bulk-action-bar button.btn-bulk-delete {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.35);
      color: #f87171;
    }

    /* Data Table */
    .aze-table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .aze-data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    .aze-data-table thead th {
      background: var(--table-header);
      color: var(--muted-text);
      font-weight: 600;
      font-size: 12px;
      text-transform: capitalize;
      letter-spacing: 0.02em;
      border-bottom: 1px solid var(--table-border);
      white-space: nowrap;
      user-select: none;
    }

    .sort-eq {
      color: #475569;
      font-size: 11px;
      margin-left: 2px;
    }

    .aze-data-table tbody td {
      border-bottom: 1px solid var(--table-border);
      color: #e2e8f0;
      transition: background 0.1s ease;
      vertical-align: middle;
    }

    .aze-data-table tbody tr:hover td {
      background: var(--table-row-hover);
    }

    /* Density padding */
    .density-compact th, .density-compact td { padding: 6px 14px; font-size: 12px; }
    .density-cozy th, .density-cozy td { padding: 11px 16px; font-size: 13px; }
    .density-comfortable th, .density-comfortable td { padding: 16px 18px; font-size: 13.5px; }

    /* Custom Checkbox */
    .aze-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border: 1.5px solid #475569;
      border-radius: 3px;
      background: #091226;
      cursor: pointer;
      position: relative;
      display: inline-block;
      vertical-align: middle;
      transition: all 0.15s ease;
    }

    .aze-checkbox:checked {
      background: #06b6d4;
      border-color: #06b6d4;
    }

    .aze-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 1.5px;
      width: 3.5px;
      height: 7px;
      border: solid #04111d;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* Badges & Pills */
    .cefr-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
    }

    .cefr-badge.c2 { background: rgba(16, 185, 129, 0.16); color: #34d399; }
    .cefr-badge.c1 { background: rgba(168, 85, 247, 0.16); color: #c084fc; }
    .cefr-badge.b2 { background: rgba(20, 184, 166, 0.16); color: #2dd4bf; }
    .cefr-badge.b1 { background: rgba(249, 115, 22, 0.16); color: #fb923c; }
    .cefr-badge.a2 { background: rgba(245, 158, 11, 0.16); color: #fbbf24; }
    .cefr-badge.a1 { background: rgba(129, 140, 248, 0.16); color: #a5b4fc; }

    .cluster-id-badge {
      display: inline-flex;
      align-items: center;
      background: #0f1c3f;
      color: #38bdf8;
      border: 1px solid #1e3a66;
      border-radius: var(--radius-sm);
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
    }

    /* GSE Range Badge matching Screenshot 1 */
    .gse-range-badge {
      display: inline-flex;
      align-items: center;
      background: #172554;
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      font-weight: 600;
    }

    .attached-cefr-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6, 182, 212, 0.08);
      border: 1px solid rgba(6, 182, 212, 0.25);
      color: #22d3ee;
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 500;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-pill.active {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-pill .dot {
      width: 5px;
      height: 5px;
      border-radius: 9999px;
      background: currentColor;
    }

    /* Expand / Collapse Chevron Buttons */
    .row-expand-btn {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted-text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .row-expand-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .row-expand-btn.open svg {
      transform: rotate(90deg);
    }

    .row-expand-btn svg {
      width: 14px;
      height: 14px;
      transition: transform 0.15s ease;
    }

    /* Action Buttons with Tooltips */
    .action-btn-group {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .row-action-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--muted-text);
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }

    .row-action-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .row-action-btn.btn-delete:hover {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .row-action-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Multi-Tier Nested Tables */
    .nested-tier-cell {
      padding: 0 !important;
      background: #040917 !important;
      border-bottom: 2px solid #142242 !important;
    }

    .nested-panel-wrapper {
      padding: 14px 20px 18px 44px;
      border-left: 3px solid #06b6d4;
    }

    .nested-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 12.5px;
    }

    .nested-panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e2e8f0;
      font-weight: 600;
    }

    .nested-aze-table {
      width: 100%;
      border-collapse: collapse;
      background: #060e22;
      border: 1px solid #142242;
      border-radius: var(--radius-md);
      overflow: hidden;
      font-size: 12.5px;
    }

    .nested-aze-table th {
      background: #0a1530;
      color: var(--muted-text);
      padding: 8px 12px;
      font-weight: 600;
      font-size: 11.5px;
      border-bottom: 1px solid #142242;
    }

    .nested-aze-table td {
      padding: 9px 12px;
      border-bottom: 1px solid #0f1c38;
      color: #e2e8f0;
    }

    .nested-aze-table tr:hover td {
      background: #0d1a38;
    }

    /* Tier 3 Can Do statements table */
    .tier3-wrapper {
      padding: 10px 16px 14px 40px;
      border-left: 3px solid #8b5cf6;
      background: #030714;
    }

    .tier3-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .statements-subtable {
      width: 100%;
      border-collapse: collapse;
      background: #050a1b;
      border: 1px solid #172445;
      border-radius: var(--radius-sm);
    }

    .statements-subtable th {
      background: #09132c;
      color: #94a3b8;
      padding: 6px 10px;
      font-size: 11px;
      border-bottom: 1px solid #172445;
    }

    .statements-subtable td {
      padding: 8px 10px;
      border-bottom: 1px solid #0f1c38;
      font-size: 12px;
    }

    /* Grid Card View (GridView / GridCard) */
    .aze-grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      padding: 18px;
    }

    .grid-card {
      background: #060e22;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .grid-card:hover {
      border-color: rgba(6, 182, 212, 0.4);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    .grid-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid-index-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--dim-text);
      background: #091226;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
    }

    .grid-card-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .grid-card-fields {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
    }

    .grid-field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
    }

    .grid-field-label {
      color: var(--dim-text);
      font-size: 11.5px;
    }

    .grid-field-value {
      color: #e2e8f0;
      font-weight: 500;
    }

    /* Table Footer & Pagination */
    .aze-table-footer {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-subtle);
      background: #060e22;
      font-size: 12.5px;
      color: var(--muted-text);
      flex-wrap: wrap;
      gap: 12px;
    }

    .pagination-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .page-sq-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      background: #070e20;
      border: 1px solid var(--border-subtle);
      color: var(--muted-text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .page-sq-btn:hover {
      border-color: #334155;
      color: #fff;
    }

    .page-sq-btn.active {
      background: #06b6d4;
      border-color: #06b6d4;
      color: #04111d;
      font-weight: 700;
    }

    /* Modals & Dialogs (Radix UI Style) */
    .aze-dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.15s ease;
    }

    .aze-dialog-box {
      background: #060e22;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
      animation: scaleUp 0.15s ease;
      overflow: hidden;
    }

    .aze-dialog-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .aze-dialog-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .aze-dialog-close {
      background: transparent;
      border: none;
      color: var(--muted-text);
      cursor: pointer;
      padding: 4px;
      border-radius: var(--radius-sm);
    }

    .aze-dialog-close:hover {
      color: #fff;
    }

    .aze-dialog-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
    }

    .aze-dialog-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      background: #040917;
    }

    /* Form Fields */
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .form-field-group {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .field-label .req {
      color: #ef4444;
      margin-left: 2px;
    }

    .field-hint {
      font-size: 11px;
      color: var(--dim-text);
      margin-top: 4px;
    }

    .aze-input, .aze-select-field {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.15s ease;
    }

    .aze-input:focus, .aze-select-field:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.15);
    }

    /* Multi-select Level Pills Group in Add Cluster Modal */
    .level-multiselect-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 0;
    }

    .level-select-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-md);
      background: #070e20;
      border: 1px solid var(--border-subtle);
      color: var(--muted-text);
      font-size: 12.5px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .level-select-pill:hover {
      border-color: #334155;
      color: #fff;
    }

    .level-select-pill.selected {
      background: rgba(6, 182, 212, 0.18);
      border-color: #06b6d4;
      color: #fff;
      font-weight: 600;
    }

    /* Detail Modal Specific Styles */
    .cluster-detail-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      background: #040917;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      margin-bottom: 20px;
    }

    .detail-meta-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .detail-meta-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--dim-text);
      font-weight: 600;
    }

    .detail-meta-value {
      font-size: 13px;
      color: #f1f5f9;
      font-weight: 600;
    }

    .select-all-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #09142e;
      border: 1px solid #1a2a50;
      border-radius: var(--radius-md);
      margin-bottom: 10px;
      font-size: 12.5px;
    }

    /* Evidence Repeater Section */
    .evidence-section-container {
      background: #040a1c;
      border: 1px solid #162444;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 14px;
    }

    .evidence-header-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .evidence-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .evidence-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .evidence-weight-input-wrap {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      padding-right: 8px;
      width: 85px;
      flex-shrink: 0;
    }

    .evidence-weight-input-wrap input {
      width: 55px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 12.5px;
      font-family: var(--font-mono);
      padding: 8px;
      outline: none;
      text-align: right;
    }

    .evidence-weight-input-wrap span {
      color: var(--dim-text);
      font-size: 12px;
    }

    .btn-add-evidence-dashed {
      width: 100%;
      border: 1px dashed rgba(6, 182, 212, 0.4);
      background: rgba(6, 182, 212, 0.04);
      color: #38bdf8;
      border-radius: var(--radius-md);
      padding: 8px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-add-evidence-dashed:hover {
      background: rgba(6, 182, 212, 0.1);
      border-color: #06b6d4;
    }

    .evidence-weight-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 12.5px;
      margin-top: 12px;
    }

    .evidence-weight-banner.valid {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }

    .evidence-weight-banner.invalid {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
    }

    /* Column Customizer Popover */
    .column-popover-box {
      position: absolute;
      top: 45px;
      right: 0;
      width: 240px;
      background: #060e22;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      z-index: 100;
      animation: fadeIn 0.1s ease;
    }

    .column-popover-title {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .column-popover-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 12px;
      color: #94a3b8;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .aze-toast {
      background: #091530;
      border: 1px solid #1e3a66;
      color: #fff;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideUp 0.2s ease;
    }

    .aze-toast.success {
      border-color: rgba(16, 185, 129, 0.5);
      color: #34d399;
    }

    .aze-toast.destructive {
      border-color: rgba(239, 68, 68, 0.5);
      color: #f87171;
    }

    .app-page-footer {
      text-align: center;
      padding: 24px 0 10px;
      color: #475569;
      font-size: 12px;
    }

    /* Evidence Column Chip & Interactive Popover */
    .evidence-info-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 9999px;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.35);
      color: #38bdf8;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .evidence-info-chip:hover {
      background: rgba(6, 182, 212, 0.22);
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      transform: translateY(-1px);
    }

    .evidence-info-chip svg {
      width: 13px;
      height: 13px;
      color: #06b6d4;
    }

    .evidence-popover-backdrop {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: transparent;
    }

    .evidence-popover {
      position: absolute;
      z-index: 1000;
      width: 380px;
      background: #08122c;
      border: 1px solid #1e3a6a;
      border-radius: var(--radius-lg);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(56, 189, 248, 0.2);
      padding: 16px;
      animation: scaleUp 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .evidence-popover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .evidence-popover-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .evidence-popover-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
    }

    .evidence-popover-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      background: #04091a;
      border: 1px solid #14244a;
      border-radius: var(--radius-md);
      font-size: 12px;
      line-height: 1.45;
    }

    .evidence-popover-item span.text {
      color: #e2e8f0;
      flex: 1;
    }

    .evidence-weight-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    .evidence-popover-footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
  
    /* CEFR Table Hover Actions (Screenshot 1 alignment) */
    .cefr-hover-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .aze-data-table tbody tr:hover .cefr-hover-actions {
      opacity: 1;
    }

    /* Modal Creation Mode Pills */
    .modal-tab-pill-group {
      display: flex;
      align-items: center;
      background: #070e20;
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      padding: 3px;
      margin-bottom: 16px;
      gap: 4px;
    }
    .modal-tab-pill {
      flex: 1;
      padding: 6px 12px;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-text);
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .modal-tab-pill.active {
      background: #06b6d4;
      color: #04111d;
      font-weight: 600;
    }

    /* Batch CEFR Selection Grid */
    .batch-cefr-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
      max-height: 220px;
      overflow-y: auto;
      padding: 4px 1px;
    }
    .batch-cefr-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #070e20;
      border: 1px solid var(--border-subtle);

    /* -------------------------------------------------------------
       VIEW CONTROLLERS & RENDERING ENGINE
       ------------------------------------------------------------- */
    function setSubTab(tabName) {
      activeSubTab = tabName;
      selectedRowIds.clear();
      render();
    }

    function setSkill(skillName) {
      activeSkill = skillName;
      render();
    }

    function setDensity(mode) {
      currentDensity = mode;
      render();
    }

    function setViewMode(mode) {
      viewMode = mode;
      render();
    }

    function toggleSidebar() {
      isSidebarCollapsed = !isSidebarCollapsed;
      const sidebar = document.querySelector('.app-sidebar');
      if (sidebar) {
        if (isSidebarCollapsed) {
          sidebar.classList.add('sidebar-collapsed');
        } else {
          sidebar.classList.remove('sidebar-collapsed');
        }
      }
    }

    function toggleFullscreen() {
      isFullscreen = !isFullscreen;
      const card = document.querySelector('.aze-card-container');
      if (card) {
        if (isFullscreen) {
          card.classList.add('is-fullscreen');
        } else {
          card.classList.remove('is-fullscreen');
        }
      }
    }

    function handleSearch(val) {
      searchQuery = (val || '').toLowerCase().trim();
      render();
      const input = document.getElementById('tableSearchInput');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function clearSearch() {
      searchQuery = '';
      render();
    }

    function resetFilters() {
      searchQuery = '';
      selectedRowIds.clear();
      showToast('Filters reset to default', 'info');
      render();
    }

    function toggleColumnPopover() {
      columnPopoverOpen = !columnPopoverOpen;
      render();
    }

    function toggleColumn(colKey) {
      visibleColumns[colKey] = !visibleColumns[colKey];
      render();
    }

    function toggleCefrLevelRow(lvl) {
      expandedCefrLevelKeys[lvl] = !expandedCefrLevelKeys[lvl];
      render();
    }

    function toggleSelectAll(allIds) {
      if (selectedRowIds.size === allIds.length) {
        selectedRowIds.clear();
      } else {
        allIds.forEach(id => selectedRowIds.add(id));
      }
      render();
    }

    function toggleSelectRow(id) {
      if (selectedRowIds.has(id)) {
        selectedRowIds.delete(id);
      } else {
        selectedRowIds.add(id);
      }
      render();
    }

    function handleBulkDelete() {
      openDeleteModal(`${selectedRowIds.size} selected items`, 'Bulk Selection', () => {
        selectedRowIds.clear();
        showToast('Selected items deleted successfully', 'destructive');
        render();
      });
    }

    function exportData() {
      showToast('Export started: CSV download initiated!', 'success');
    }

    function render() {
      const container = document.getElementById('pageContainer');
      if (!container) return;

      if (activeSubTab === 'clusters') {
        renderClustersView(container);
      } else if (activeSubTab === 'cefr-levels') {
        renderCefrLevelsView(container);
      } else if (activeSubTab === 'can-do-statements') {
        renderCanDoStatementsView(container);
      } else {
        renderOtherTabView(container, activeSubTab);
      }
    }

    /* -------------------------------------------------------------
       MODALS, DIALOGS & NOTIFICATIONS ENGINE
       ------------------------------------------------------------- */
    function closeModal() {
      const modal = document.getElementById('modalContainer');
      if (modal) {
        modal.style.display = 'none';
        modal.innerHTML = '';
      }
    }

    function showToast(message, type = 'info') {
      let container = document.getElementById('toastContainer');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container';
        document.body.appendChild(container);
      }

      const toast = document.createElement('div');
      toast.className = `aze-toast ${type}`;
      toast.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;flex-shrink:0;">
          ${type === 'success' ? '<polyline points="20 6 9 17 4 12"/>' : type === 'destructive' ? '<circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/>' : '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/>'}
        </svg>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s ease';
        setTimeout(() => toast.remove(), 200);
      }, 3500);
    }

                  <span class="detail-meta-value" style="color:#38bdf8;font-family:var(--font-mono);">${cluster.gseRange}</span>
                </div>
                <div class="detail-meta-item">
                  <span class="detail-meta-label">Attached Levels</span>
                  <span class="detail-meta-value">${attached.length} CEFR Levels</span>
                </div>
                <div class="detail-meta-item">
                  <span class="detail-meta-label">Total Statements</span>
                  <span class="detail-meta-value" style="color:#34d399;">${totalStatements} Attached</span>
                </div>
              </div>

              <!-- Inner Table: Attached CEFR Levels for this Cluster -->
              <div style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;">
                <div style="font-size:14px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:#06b6d4;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                  <span>Attached CEFR Levels for <strong>${cluster.id}</strong></span>
                </div>
                <span style="font-size:12px;color:var(--dim-text);">Click statements chip to preview descriptors</span>
              </div>

              <div class="aze-table-wrap" style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;background:#050a1b;">
                <table class="nested-aze-table" style="margin:0;">
                  <thead>
                    <tr>
                      <th style="width:90px;">CEFR Level</th>
                      <th>Descriptor / Level Title</th>
                      <th style="width:140px;">Domain</th>
                      <th style="width:110px;">GSE Range</th>
                      <th style="width:190px;">Can Do Statements</th>
                      <th style="width:90px;">Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${attached.map(cefr => {
                      const isStmtsOpen = !!detailExpandedLevelKeys[cefr.level];
                      return `
                        <tr>
                          <td><span class="cefr-badge ${cefr.levelClass}">${cefr.level}</span></td>
                          <td><strong style="color:#fff;">${cefr.title}</strong></td>
                          <td style="color:#cbd5e1;">${cefr.domain}</td>
                          <td><span class="gse-range-badge">${cefr.gseRange}</span></td>
                          <td>
                            <button class="btn-aze-outline" style="padding:4px 10px;font-size:11.5px;color:#38bdf8;gap:6px;" onclick="toggleDetailLevelStmts('${cefr.level}', '${cluster.id}')">
                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                              <span>${cefr.statements.length} Statements</span>
                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:11px;height:11px;transform:${isStmtsOpen ? 'rotate(180deg)' : 'none'};"><path d="m6 9 6 6 6-6"/></svg>
                            </button>
                          </td>
                          <td><span class="status-pill active"><span class="dot"></span> ${cefr.status}</span></td>
                        </tr>
                        ${isStmtsOpen ? `
                          <tr>
                            <td colspan="6" style="padding:0;background:#030714;">
                              <div style="padding:12px 18px;border-left:3px solid #06b6d4;background:#04091a;">
                                <div style="font-size:12px;font-weight:600;color:#38bdf8;margin-bottom:8px;">Can Do Statements attached under ${cefr.level}:</div>
                                <div style="display:flex;flex-direction:column;gap:6px;">
                                  ${cefr.statements.map(s => `
                                    <div style="padding:6px 10px;background:#060e24;border:1px solid #142242;border-radius:4px;font-size:12px;display:flex;align-items:flex-start;gap:8px;">
                                      <span class="gse-range-badge" style="font-size:10.5px;padding:1px 5px;">GSE ${s.gse}</span>
                                      <span style="color:#e2e8f0;">${s.text}</span>
                                    </div>
                                  `).join('')}
                                </div>
                              </div>
                            </td>
                          </tr>
                        ` : ''}
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="aze-dialog-footer">
              <button class="btn-aze-outline" onclick="closeModal()">Close</button>
              <button class="btn-aze-primary" onclick="closeModal(); openAddClusterModal('${cluster.id}');">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                <span>Edit Cluster</span>
              </button>
            </div>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

    function toggleDetailLevelStmts(lvl, clusterId) {
      detailExpandedLevelKeys[lvl] = !detailExpandedLevelKeys[lvl];
      openClusterDetailModal(clusterId);
    }

    /* -------------------------------------------------------------
       2. ADD / EDIT CLUSTER MODAL
       Refined requirements:
       - Skill, Cluster ID, Cluster Name, Level (multi-selected)
       - Attach Specific Can Do Statements (multi-select + select all option)
       - REMOVED: GSE Min, GSE Max, GSE Range
       - Standard domains only (No Progressing domain)
       ------------------------------------------------------------- */
    let selectedClusterLevels = ['C2', 'C1']; // Multi-select array of Levels

    function openAddClusterModal(editId = null) {
      const modal = document.getElementById('modalContainer');
      if (!modal) return;

      const cluster = editId ? clusterTableData.find(c => c.id === editId) : null;
      const initialId = cluster ? cluster.id : 'CLUST-ADV-01';
      const initialName = cluster ? cluster.name : 'Advanced Professional Mastery';
      const initialDomain = cluster ? cluster.domain : 'Business English';

      if (cluster && cluster.attachedCefrLevels) {
        selectedClusterLevels = cluster.attachedCefrLevels.map(c => c.level);
      } else if (!editId) {
        selectedClusterLevels = ['C2', 'C1'];
      }

      renderAddClusterModalContent(initialId, initialName, initialDomain);
      modal.style.display = 'flex';
    }

    function renderAddClusterModalContent(cId, cName, cDomain) {
      const modal = document.getElementById('modalContainer');
      const allLevels = ['C2', 'C1', 'B2', 'B1', 'A2', 'A1'];

      modal.innerHTML = `
        <div class="aze-dialog-backdrop" onclick="if(event.target === this) closeModal()">
          <div class="aze-dialog-box" style="max-width: 640px;">
            <div class="aze-dialog-header">
              <span class="aze-dialog-title">Add New Cluster</span>
              <button class="aze-dialog-close" onclick="closeModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>

            <div class="aze-dialog-body">
              <div class="form-grid-2">
                <div class="form-field-group">
                  <label class="field-label">Skill <span class="req">*</span></label>
                  <select class="aze-select-field" id="clusterSkill">
                    <option value="Language Awareness">Language Awareness</option>
                    <option value="Listening">Listening</option>
                    <option value="Reading">Reading</option>
                    <option value="Speaking">Speaking</option>
                    <option value="Writing">Writing</option>
                  </select>
                </div>
                <div class="form-field-group">
                  <label class="field-label">Cluster ID <span class="req">*</span></label>
                  <input type="text" class="aze-input" id="clusterIdInput" value="${cId}" placeholder="e.g. CLUST-ADV-01">
                  <div class="field-hint">Unique identifier entered by Admin</div>
                </div>
              </div>

              <div class="form-grid-2">
                <div class="form-field-group">
                  <label class="field-label">Cluster Name <span class="req">*</span></label>
                  <input type="text" class="aze-input" id="clusterNameInput" value="${cName}" placeholder="e.g. Advanced Professional Mastery">
                </div>
                <div class="form-field-group">
                  <label class="field-label">Domain <span class="req">*</span></label>
                  <!-- Standard domains only (NO Progressing domain) -->
                  <select class="aze-select-field" id="clusterDomainInput">
                    <option value="Business English" ${cDomain === 'Business English' ? 'selected' : ''}>Business English</option>
                    <option value="General English" ${cDomain === 'General English' ? 'selected' : ''}>General English</option>
                    <option value="Academic English" ${cDomain === 'Academic English' ? 'selected' : ''}>Academic English</option>
                  </select>
                  <div class="field-hint">Standard domains only (no progressing)</div>
                </div>
              </div>

              <!-- LEVEL - MULTI SELECTED -->
              <div class="form-field-group">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                  <label class="field-label" style="margin-bottom:0;">Level (Multi-Select) <span class="req">*</span></label>
                  <span style="font-size:11px;color:#38bdf8;">${selectedClusterLevels.length} Levels Selected</span>
                </div>
                <div class="level-multiselect-grid">
                  ${allLevels.map(lvl => {
                    const isSelected = selectedClusterLevels.includes(lvl);
                    return `
                      <div class="level-select-pill ${isSelected ? 'selected' : ''}" onclick="toggleClusterLevelMulti('${lvl}', '${cId}', '${cName}', '${cDomain}')">
                        <input type="checkbox" class="aze-checkbox" ${isSelected ? 'checked' : ''} style="pointer-events:none;">
                        <span class="cefr-badge ${lvl.toLowerCase()}">${lvl}</span>
                      </div>
                    `;
                  }).join('')}
                </div>
                <div class="field-hint">Selecting levels attaches them to this cluster</div>
              </div>

              <!-- ATTACH SPECIFIC CAN DO STATEMENTS WITH MULTI-SELECT & SELECT ALL -->
              <div class="form-field-group" style="margin-top:16px;">
                <label class="field-label">Attach Specific Can Do Statements to Cluster</label>
                <div id="clusterCanDoDropdownsArea">
                  ${renderClusterCanDoStatementsPicker()}
                </div>
              </div>
            </div>

            <div class="aze-dialog-footer">
              <button class="btn-aze-outline" onclick="closeModal()">Cancel</button>
              <button class="btn-aze-primary" onclick="handleSaveCluster()">Save Cluster</button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleClusterLevelMulti(lvl, cId, cName, cDomain) {
      if (selectedClusterLevels.includes(lvl)) {
        if (selectedClusterLevels.length === 1) {
          showToast('At least one level must be selected', 'info');
          return;
        }
        selectedClusterLevels = selectedClusterLevels.filter(x => x !== lvl);
      } else {
        selectedClusterLevels.push(lvl);
      }
      renderAddClusterModalContent(
        document.getElementById('clusterIdInput')?.value || cId,
        document.getElementById('clusterNameInput')?.value || cName,
        document.getElementById('clusterDomainInput')?.value || cDomain
      );
    }

    function renderClusterCanDoStatementsPicker() {
      if (selectedClusterLevels.length === 0) {
        return `<div style="font-size:12px;color:var(--dim-text);padding:12px;background:#040a1b;border-radius:6px;">Select at least one Level above to attach Can Do Statements.</div>`;
      }

      // Calculate total available and total selected across all active levels
      let totalAvailable = 0;
      let totalSelected = 0;
      selectedClusterLevels.forEach(lvl => {
        const list = availableCanDoStatements[lvl] || [];
        totalAvailable += list.length;
        totalSelected += list.filter(s => s.selected).length;
      });
      const isGlobalAllSelected = totalAvailable > 0 && totalSelected === totalAvailable;

      return `
        <div style="background:#040a1b;border:1px solid #162444;border-radius:8px;padding:12px;">
          <!-- Master Global Select All Option -->
          <div class="select-all-header-row">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:#fff;font-weight:600;">
              <input type="checkbox" class="aze-checkbox" ${isGlobalAllSelected ? 'checked' : ''} onchange="toggleSelectAllStatementsGlobal(this.checked)">
              <span>Select All Statements across All Selected Levels</span>
            </label>
            <span style="color:#38bdf8;font-family:var(--font-mono);">${totalSelected} of ${totalAvailable} Selected</span>
          </div>

          <!-- Per-Level Collapsible Groups with Individual Select All -->
          ${selectedClusterLevels.map(lvl => {
            const stmts = availableCanDoStatements[lvl] || [];
            const selectedCount = stmts.filter(s => s.selected).length;
            const isLevelAllSelected = stmts.length > 0 && selectedCount === stmts.length;
            const isOpen = openCanDoDropdowns[lvl] !== false;

            return `
              <div style="margin-bottom:8px;border:1px solid #172445;border-radius:6px;overflow:hidden;background:#060e22;">
                <!-- Level Accordion Header -->
                <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#09142c;">
                  <div style="display:flex;align-items:center;gap:10px;">
                    <button class="row-expand-btn ${isOpen ? 'open' : ''}" style="width:20px;height:20px;" onclick="toggleCanDoDropdown('${lvl}')">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                    <span class="cefr-badge ${lvl.toLowerCase()}">${lvl}</span>
                    <span style="font-size:12.5px;font-weight:600;color:#fff;">${lvl} Statements</span>
                  </div>

                  <!-- Per-Level Select All Checkbox -->
                  <div style="display:flex;align-items:center;gap:12px;">
                    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8;cursor:pointer;">
                      <input type="checkbox" class="aze-checkbox" ${isLevelAllSelected ? 'checked' : ''} onchange="toggleSelectAllLevelStatements('${lvl}', this.checked)">
                      <span>Select All (${stmts.length})</span>
                    </label>
                    <span style="font-size:11.5px;color:#38bdf8;font-family:var(--font-mono);">${selectedCount}/${stmts.length}</span>
                  </div>
                </div>

                <!-- Statements List -->
                ${isOpen ? `
                  <div style="padding:10px 14px;border-top:1px solid #142242;background:#030714;display:flex;flex-direction:column;gap:6px;max-height:170px;overflow-y:auto;">
                    ${stmts.map(s => `
                      <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#cbd5e1;cursor:pointer;padding:4px 0;">
                        <input type="checkbox" class="aze-checkbox" ${s.selected ? 'checked' : ''} onchange="toggleCanDoStatementSelection('${lvl}', '${s.id}')">
                        <span style="line-height:1.4;"><strong style="color:#38bdf8;font-family:var(--font-mono);">[GSE ${s.gse}]</strong> ${s.text}</span>
                      </label>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function toggleSelectAllStatementsGlobal(shouldSelect) {
      selectedClusterLevels.forEach(lvl => {
        const list = availableCanDoStatements[lvl] || [];
        list.forEach(s => s.selected = shouldSelect);
      });
      const area = document.getElementById('clusterCanDoDropdownsArea');
      if (area) area.innerHTML = renderClusterCanDoStatementsPicker();
    }

    function toggleSelectAllLevelStatements(lvl, shouldSelect) {
      const list = availableCanDoStatements[lvl] || [];
      list.forEach(s => s.selected = shouldSelect);
      const area = document.getElementById('clusterCanDoDropdownsArea');
      if (area) area.innerHTML = renderClusterCanDoStatementsPicker();
    }

    function toggleCanDoStatementSelection(lvl, stmtId) {
      const list = availableCanDoStatements[lvl] || [];
      const item = list.find(s => s.id === stmtId);
      if (item) item.selected = !item.selected;
      const area = document.getElementById('clusterCanDoDropdownsArea');
      if (area) area.innerHTML = renderClusterCanDoStatementsPicker();
    }

    function toggleCanDoDropdown(lvl) {
      openCanDoDropdowns[lvl] = openCanDoDropdowns[lvl] === false ? true : false;
      const area = document.getElementById('clusterCanDoDropdownsArea');
      if (area) area.innerHTML = renderClusterCanDoStatementsPicker();
    }

    function handleSaveCluster() {
      const id = document.getElementById('clusterIdInput')?.value.trim();
      const name = document.getElementById('clusterNameInput')?.value.trim();
      const domain = document.getElementById('clusterDomainInput')?.value;

      if (!id || !name) {
        showToast('Please fill in Cluster ID and Name', 'destructive');
        return;
      }
      if (selectedClusterLevels.length === 0) {
        showToast('Please select at least one Level for the cluster', 'destructive');
        return;
      }

      // Default GSE range mappings based on attached levels
      const levelGseDefaults = {
        'C2': { min: 85, max: 90 },
        'C1': { min: 76, max: 84 },
        'B2': { min: 59, max: 75 },
        'B1': { min: 43, max: 58 },
        'A2': { min: 30, max: 42 },
        'A1': { min: 10, max: 29 }
      };

      let overallMin = 100;
      let overallMax = 0;

      const attached = selectedClusterLevels.map(lvl => {
        const gseInfo = levelGseDefaults[lvl] || { min: 50, max: 70 };
        if (gseInfo.min < overallMin) overallMin = gseInfo.min;
        if (gseInfo.max > overallMax) overallMax = gseInfo.max;

        const stmts = (availableCanDoStatements[lvl] || []).filter(s => s.selected).map((s, i) => ({
          no: `0${i+1}`,
          gse: s.gse,
          domain: domain,
          text: s.text
        }));

        return {
          key: `${id}-${lvl}`,
          level: lvl,
          levelClass: lvl.toLowerCase(),
          title: `${lvl} Proficiency`,
          domain: domain,
          gseRange: `${gseInfo.min} - ${gseInfo.max}`,
          status: 'Active',
          statements: stmts
        };
      });

      const computedGseRange = overallMin <= overallMax ? `${overallMin} - ${overallMax}` : '76 - 90';
      const primaryLevel = selectedClusterLevels[0] || 'C2';

      const existing = clusterTableData.find(c => c.id === id);
      if (existing) {
        existing.name = name;
        existing.domain = domain;
        existing.level = primaryLevel;
        existing.levelClass = primaryLevel.toLowerCase();
        existing.gseRange = computedGseRange;
        existing.attachedCefrLevels = attached;
      } else {
        clusterTableData.unshift({
          id: id,
          name: name,
          domain: domain,
          level: primaryLevel,
          levelClass: primaryLevel.toLowerCase(),
          gseRange: computedGseRange,
          attachedCefrLevels: attached
        });
      }

      closeModal();
      showToast(`Cluster "${id}" saved successfully!`, 'success');
      render();
    }

    /* -------------------------------------------------------------
       3. ADD CEFR LEVEL MODAL (For CEFR Levels Tab)
       ------------------------------------------------------------- */
    
    // Standard CEFR Presets mapping
    const CEFR_PRESETS = {
      'C2': { min: 85, max: 90, range: '85 - 90', class: 'c2' },
      'C1': { min: 76, max: 84, range: '76 - 84', class: 'c1' },
      'B2': { min: 59, max: 75, range: '59 - 75', class: 'b2' },
      'B1': { min: 43, max: 58, range: '43 - 58', class: 'b1' },
      'A2': { min: 30, max: 42, range: '30 - 42', class: 'a2' },
      'A1': { min: 10, max: 29, range: '10 - 29', class: 'a1' },
      'Pre-A1': { min: 10, max: 21, range: '10 - 21', class: 'a1' },
      'C2+': { min: 88, max: 90, range: '88 - 90', class: 'c2' }
    };

    let selectedQuestionFieldType = 'CEFR Levels';
    let cefrModalMode = 'single'; // 'single' or 'batch'
    let batchSelectedLevels = new Set(['C2', 'C1', 'B2', 'B1', 'A2', 'A1']);

    function setCefrModalMode(mode) {
      cefrModalMode = mode;
      renderAddQuestionFieldContent();
    }

    function toggleBatchLevelSelection(lvl) {
      if (batchSelectedLevels.has(lvl)) {
        batchSelectedLevels.delete(lvl);
      } else {
        batchSelectedLevels.add(lvl);
      }
      renderAddQuestionFieldContent();
    }

    function handleFieldCefrLevelChange(val) {
      const gseInput = document.getElementById('fieldGseScoreInput');
      const minInput = document.getElementById('fieldGseMinInput');
      const maxInput = document.getElementById('fieldGseMaxInput');
      const preset = CEFR_PRESETS[val];

      if (preset) {
        if (gseInput) {
          gseInput.value = preset.range;
          gseInput.placeholder = preset.range;
          gseInput.disabled = false;
        }
        if (minInput) minInput.value = preset.min;
        if (maxInput) maxInput.value = preset.max;
      } else if (val === 'custom') {
        if (gseInput) {
          gseInput.value = '';
          gseInput.placeholder = 'e.g. 85 - 90';
          gseInput.disabled = false;
        }
      } else {
        if (gseInput) {
          gseInput.value = '';
          gseInput.placeholder = 'Select Level first';
          gseInput.disabled = true;
        }
      }
    }

    function handleQuestionFieldTypeChange(val) {
      selectedQuestionFieldType = val;
      renderAddQuestionFieldContent();
    }

    function openEditCefrLevelModal(levelKey) {
      const lvlObj = cefrLevelsData.find(x => x.level === levelKey);
      if (!lvlObj) return;
      openAddQuestionFieldModal('CEFR Levels', lvlObj);
    }

    function deleteCefrLevel(levelKey) {
      openDeleteModal(`CEFR Level ${levelKey}`, 'CEFR Level', () => {
        cefrLevelsData = cefrLevelsData.filter(x => x.level !== levelKey);
        cefrLevelsData.forEach((item, idx) => { item.no = idx + 1; });
        showToast(`CEFR Level "${levelKey}" deleted successfully.`, 'info');
        render();
      });
    }

    function handleSaveCefrFromModal(editingLevel = null) {
      if (cefrModalMode === 'single') {
        const lvlSelect = document.getElementById('fieldCefrLevelSelect');
        const customInput = document.getElementById('fieldCustomLevelInput');
        const levelVal = (lvlSelect && lvlSelect.value === 'custom' && customInput) ? customInput.value.trim() : (lvlSelect ? lvlSelect.value : '');
        
        if (!levelVal) {
          showToast('Please select or specify a CEFR Level.', 'error');
          return;
        }

        const minVal = parseInt(document.getElementById('fieldGseMinInput')?.value) || 10;
        const maxVal = parseInt(document.getElementById('fieldGseMaxInput')?.value) || 90;
        const domainVal = document.getElementById('fieldDomainSelect')?.value || 'General Adult';
        const createAnother = document.getElementById('createAnotherCefrCheckbox')?.checked;

        const preset = CEFR_PRESETS[levelVal] || { class: 'c1' };
        const existing = cefrLevelsData.find(x => x.level === levelVal);

        if (existing) {
          existing.gseMin = minVal;
          existing.gseMax = maxVal;
          existing.gseRange = `${minVal} - ${maxVal}`;
          existing.domain = domainVal;
        } else {
          cefrLevelsData.push({
            no: cefrLevelsData.length + 1,
            id: `LVL-${levelVal.toUpperCase()}`,
            level: levelVal,
            levelClass: preset.class || levelVal.toLowerCase(),
            gseMin: minVal,
            gseMax: maxVal,
            gseRange: `${minVal} - ${maxVal}`,
            domain: domainVal,
            status: 'Active'
          });
        }

        // Re-sort descending by gseMin
        cefrLevelsData.sort((a, b) => (b.gseMin || 0) - (a.gseMin || 0));
        cefrLevelsData.forEach((item, idx) => { item.no = idx + 1; });

        if (createAnother) {
          showToast(`CEFR Level "${levelVal}" added to table! Enter next level...`, 'success');
          render();
          // Reset form fields for rapid sequential addition
          if (lvlSelect) lvlSelect.value = '';
          const gseInput = document.getElementById('fieldGseScoreInput');
          if (gseInput) { gseInput.value = ''; gseInput.placeholder = 'Select Level first'; gseInput.disabled = true; }
        } else {
          closeModal();
          showToast(`CEFR Level "${levelVal}" saved successfully!`, 'success');
          render();
        }
      } else {
        // Batch Multi-Level creation
        let count = 0;
        batchSelectedLevels.forEach(lvl => {
          const preset = CEFR_PRESETS[lvl] || { min: 10, max: 90, range: '10 - 90', class: 'c1' };
          const existing = cefrLevelsData.find(x => x.level === lvl);
          if (!existing) {
            cefrLevelsData.push({
              no: cefrLevelsData.length + 1,
              id: `LVL-${lvl.toUpperCase()}`,
              level: lvl,
              levelClass: preset.class,
              gseMin: preset.min,
              gseMax: preset.max,
              gseRange: preset.range,
              domain: 'General Adult',
              status: 'Active'
            });
            count++;
          }
        });

        cefrLevelsData.sort((a, b) => (b.gseMin || 0) - (a.gseMin || 0));
        cefrLevelsData.forEach((item, idx) => { item.no = idx + 1; });

        closeModal();
        showToast(`Successfully provisioned ${count} CEFR levels into the first tab!`, 'success');
        render();
      }
    }

    function handleSaveCefrLevel() {
      const lvl = document.getElementById('cefrLevelSelect')?.value;
      const title = document.getElementById('cefrTitleInput')?.value;
      const clusterId = document.getElementById('cefrClusterSelect')?.value;
      const domain = document.getElementById('cefrDomainSelect')?.value;
      const min = document.getElementById('cefrMin')?.value || '85';
      const max = document.getElementById('cefrMax')?.value || '90';

      const existing = cefrLevelsData.find(x => x.level === lvl);
      if (existing) {
        existing.title = title;
        existing.clusterId = clusterId;
        existing.domain = domain;
        existing.gseMin = parseInt(min);
        existing.gseMax = parseInt(max);
        existing.gseRange = `${min} - ${max}`;
      } else {
        cefrLevelsData.unshift({
          id: `LVL-${lvl}`,
          level: lvl,
          levelClass: lvl.toLowerCase(),
          title: title,
          clusterId: clusterId,
          domain: domain,
          gseMin: parseInt(min),
          gseMax: parseInt(max),
          gseRange: `${min} - ${max}`,
          status: 'Active',
          statements: []
        });
      }

      closeModal();
      showToast(`CEFR Level "${lvl}" saved successfully!`, 'success');
      render();
    }

    function addEvidence() {
      const newId = Date.now();
      evidenceEntries.push({ id: newId, text: '', weight: 0 });
      renderAddQuestionFieldContent();
    }

    function removeEvidence(id) {
      if (evidenceEntries.length <= 1) {
        showToast('At least one evidence entry is required', 'info');
        return;
      }
      evidenceEntries = evidenceEntries.filter(e => e.id !== id);
      renderAddQuestionFieldContent();
    }

    function updateEvidenceText(id, val) {
      const item = evidenceEntries.find(e => e.id === id);
      if (item) item.text = val;
    }

    function updateEvidenceWeight(id, val) {
      const item = evidenceEntries.find(e => e.id === id);
      if (item) {
        item.weight = parseInt(val) || 0;
        renderAddQuestionFieldContent();
      }
    }
