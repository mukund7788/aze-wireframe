      closeModal();
      showToast('Question Field saved successfully!', 'success');
      render();
    }

    /* -------------------------------------------------------------
       5. DELETE CONFIRMATION MODAL (Matches DeleteQuestionFieldModal.jsx)
       ------------------------------------------------------------- */
    function openDeleteModal(displayName, itemType, onConfirmCallback) {
      const modal = document.getElementById('modalContainer');
      if (!modal) return;

      modal.innerHTML = `
        <div class="aze-dialog-backdrop" onclick="if(event.target === this) closeModal()">
          <div class="aze-dialog-box" style="max-width: 440px; text-align:center;">
            <div class="aze-dialog-body" style="padding: 28px 24px 20px;">
              <div style="width:52px;height:52px;border-radius:9999px;background:rgba(239,68,68,0.15);color:#ef4444;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:26px;height:26px;"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
              </div>
              <h3 style="font-size:18px;font-weight:700;color:#fff;margin-bottom:8px;">Delete ${itemType || 'Field'}</h3>
              <p style="font-size:13px;color:var(--muted-text);line-height:1.5;max-width:340px;margin:0 auto;">
                Are you sure you want to delete <strong style="color:#f1f5f9;">${displayName}</strong>? This action cannot be undone.
              </p>
            </div>
            <div class="aze-dialog-footer" style="justify-content:center;gap:12px;padding:16px 24px;">
              <button class="btn-aze-outline" onclick="closeModal()">Cancel</button>
              <button class="btn-aze-primary" style="background:#ef4444;border-color:#ef4444;color:#fff;" onclick="closeModal(); if (typeof onConfirmCallback === 'function') onConfirmCallback();">
                Delete
              </button>
            </div>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

    /* -------------------------------------------------------------
       6. IMPORT MODAL (Matches ImportQuestionFieldsModal.jsx)
       ------------------------------------------------------------- */
    function openImportModal() {
      const modal = document.getElementById('modalContainer');
      if (!modal) return;

      modal.innerHTML = `
        <div class="aze-dialog-backdrop" onclick="if(event.target === this) closeModal()">
          <div class="aze-dialog-box" style="max-width: 540px;">
            <div class="aze-dialog-header">
              <span class="aze-dialog-title">Import Question Fields</span>
              <button class="aze-dialog-close" onclick="closeModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>
            <div class="aze-dialog-body">
              <div class="form-grid-2">
                <div class="form-field-group">
                  <label class="field-label">Skill <span class="req">*</span></label>
                  <select class="aze-select-field">
                    <option value="Language Awareness">Language Awareness</option>
                    <option value="Listening">Listening</option>
                    <option value="Reading">Reading</option>
                  </select>
                </div>
                <div class="form-field-group">
                  <label class="field-label">Question Field <span class="req">*</span></label>
                  <select class="aze-select-field">
                    <option value="CEFR Can Do Statements">CEFR Can Do Statements</option>
                    <option value="Tasks">Tasks</option>
                    <option value="Topics">Topics</option>
                  </select>
                </div>
              </div>

              <!-- Drag & Drop Zone -->
              <div style="border:2px dashed #24355a;border-radius:8px;padding:36px 20px;text-align:center;background:#040917;margin:12px 0;cursor:pointer;" onclick="showToast('File dialog simulated', 'info')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:36px;height:36px;color:#06b6d4;margin:0 auto 10px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                <div style="font-size:13px;font-weight:600;color:#fff;margin-bottom:4px;">Drag and drop your CSV file here, or click to browse</div>
                <div style="font-size:11px;color:var(--dim-text);">Supports .csv files up to 10MB</div>
              </div>

              <div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;margin-top:8px;">
                <a href="javascript:void(0)" onclick="showToast('Sample CSV template downloaded', 'success')" style="color:#38bdf8;text-decoration:none;display:flex;align-items:center;gap:5px;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                  Download Sample CSV
                </a>
              </div>
            </div>
            <div class="aze-dialog-footer">
              <button class="btn-aze-outline" onclick="closeModal()">Cancel</button>
              <button class="btn-aze-primary" onclick="closeModal(); showToast('Question fields imported successfully!', 'success');">Import CSV</button>
            </div>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

    /* -------------------------------------------------------------
       7. EVIDENCE BREAKDOWN POPOVER
       ------------------------------------------------------------- */
    let activeEvidencePopoverId = null;

    function toggleEvidencePopover(event, stmtId) {
      if (activeEvidencePopoverId === stmtId) {
        closeEvidencePopover();
        return;
      }

      closeEvidencePopover();
      activeEvidencePopoverId = stmtId;

      const stmt = canDoStatementsData.find(s => s.id === stmtId);
      if (!stmt || !stmt.evidence || stmt.evidence.length === 0) return;

      const triggerBtn = event ? (event.currentTarget || event.target) : document.querySelector('.evidence-info-chip');
      let top = 400;
      let left = 600;

      if (triggerBtn && triggerBtn.getBoundingClientRect) {
        const rect = triggerBtn.getBoundingClientRect();
        const popoverWidth = 380;
        top = rect.bottom + 8;
        left = Math.min(rect.left, window.innerWidth - popoverWidth - 24);
        if (left < 16) left = 16;
      }

      const totalWeight = stmt.evidence.reduce((sum, item) => sum + Number(item.weight || 0), 0);

      const popoverWrap = document.createElement('div');
      popoverWrap.id = 'evidencePopoverWrap';

      popoverWrap.innerHTML = `
        <div class="evidence-popover-backdrop" onclick="closeEvidencePopover()"></div>
        <div class="evidence-popover" style="top: ${top}px; left: ${left}px;">
          <div class="evidence-popover-header">
            <div class="evidence-popover-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:#06b6d4;"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></svg>
              <span>Evidence Breakdown</span>
              <span class="evidence-weight-badge" style="margin-left:4px;font-size:10px;padding:1px 5px;">${stmt.evidence.length} Items</span>
            </div>
            <button class="aze-dialog-close" style="width:22px;height:22px;cursor:pointer;" onclick="closeEvidencePopover()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>

          <div style="font-size:11px;color:var(--dim-text);margin-bottom:10px;line-height:1.4;">
            Evidence evaluation criteria attached to Statement #${stmt.no} (${stmt.level}):
          </div>

          <div class="evidence-popover-list">
            ${stmt.evidence.map((ev, idx) => `
              <div class="evidence-popover-item">
                <span style="font-family:var(--font-mono);color:var(--dim-text);font-size:11px;padding-top:1px;">#${idx + 1}</span>
                <span class="text">${ev.text}</span>
                <span class="evidence-weight-badge">${ev.weight}%</span>
              </div>
            `).join('')}
          </div>

          <div class="evidence-popover-footer">
            <div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:#34d399;font-weight:600;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg>
              <span>Total Weightage: ${totalWeight}%</span>
            </div>
            <span style="font-size:11px;color:var(--dim-text);font-weight:500;">Valid (100%)</span>
          </div>
        </div>
      `;

      document.body.appendChild(popoverWrap);
    }

    function closeEvidencePopover() {
      activeEvidencePopoverId = null;
      const el = document.getElementById('evidencePopoverWrap');
      if (el) el.remove();
    }
    

    // Auto initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const tabParam = params.get('tab') || params.get('question_fields_tab');
      if (tabParam) {
        const tp = tabParam.toLowerCase();
        if (tp === 'cefr' || tp === 'cefr-levels' || tp === 'cefr_levels' || tp === 'levels') activeSubTab = 'cefr-levels';
        else if (tp === 'cando' || tp === 'can-do' || tp === 'can-do-statements' || tp === 'cefr_can_do_statements' || tp === 'statements') activeSubTab = 'can-do-statements';
        else if (tp === 'clusters' || tp === 'cluster') activeSubTab = 'clusters';
        else activeSubTab = tp;
      } else {
        activeSubTab = 'cefr-levels'; // First tab default per requirement
      }
      const skillParam = params.get('skill');
      if (skillParam) activeSkill = skillParam;

      const searchParam = params.get('search');
      if (searchParam) searchQuery = searchParam.toLowerCase().trim();

      render();

      const modalParam = params.get('modal');
      if (modalParam === 'cluster-detail') {
        openClusterDetailModal('CLUST-ADV-01');
      } else if (modalParam === 'add-cluster') {
        openAddClusterModal();
      } else if (modalParam === 'add-field') {
        openAddQuestionFieldModal();
      } else if (modalParam === 'delete') {
        openDeleteModal('CLUST-ADV-01 — Advanced Professional Mastery', 'Cluster');
      } else if (modalParam === 'import') {
        openImportModal();
      }

      const popoverParam = params.get('popover');
      if (popoverParam === 'evidence') {
        setTimeout(() => {
          toggleEvidencePopover(null, 'stmt-11');
        }, 80);
      }
    });
  </script>
</body>
</html>
